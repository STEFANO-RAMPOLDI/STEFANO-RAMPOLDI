<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SomaMed · CRM Ontology</title>
<style>
:root{
  --bg:#111418; --bg2:#1C2127; --panel:#252A31; --panel2:#2F343C; --line:#383E47; --line2:#404854;
  --tx:#F6F7F9; --tx2:#ABB3BF; --tx3:#738091;
  --blue:#4C90F0; --blue2:#2D72D2; --green:#32A467; --orange:#EC9A3C; --red:#E76A6E;
  --violet:#BDADFF; --teal:#3FA6DA; --gold:#F0B726;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:44px 1fr;grid-template-columns:232px 1fr;height:100vh}
/* barra superiore */
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 14px;
  background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.14em;font-size:12px;white-space:nowrap}
.logo b{color:var(--blue)}
.crumb{display:none;color:var(--tx3);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--tx);
  padding:6px 10px 6px 28px;border-radius:2px;font:inherit;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.search:before{content:"⌕";position:absolute;left:9px;top:4px;color:var(--tx3);font-size:15px}
.clock{font-family:var(--mono);font-size:11px;color:var(--tx3)}
/* barra laterale */
.side{background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:10px 0}
.area{margin:14px 10px 4px;padding:6px 4px 5px;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--blue);border-bottom:1px solid var(--line2)}
.area:first-child{margin-top:4px}
.nav.nuova{color:var(--blue);font-weight:600}
.nav.nuova .ic{color:var(--blue)} .nav.nuova:hover{color:#fff;background:rgba(45,114,210,.3)}
.sub{padding-left:28px}
.sect{padding:10px 14px 4px;font-size:10px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:7px 14px;color:var(--tx2);border-left:2px solid transparent}
.nav:hover{background:var(--panel);color:var(--tx)}
.nav.on{background:rgba(76,144,240,.12);color:var(--tx);border-left-color:var(--blue)}
.nav .ic{width:16px;text-align:center;color:var(--tx3)}
.nav.on .ic{color:var(--blue)}
.seg{display:flex;margin:6px 14px;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.seg button{flex:1;background:var(--bg);border:0;padding:5px 0;font-size:11px;color:var(--tx2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--blue2);color:#fff}
.chips{padding:4px 14px;display:flex;flex-direction:column;gap:5px}
.chip{display:flex;justify-content:space-between;align-items:center;background:var(--panel);
  border:1px solid var(--line2);padding:4px 8px;font-size:11px;border-radius:2px}
.chip span{color:var(--tx3);margin-right:6px;text-transform:uppercase;font-size:9px;letter-spacing:.08em}
.chip button{background:none;border:0;color:var(--tx3);padding:0 0 0 6px}
.chip button:hover{color:var(--red)}
.primary{display:block;margin:12px 14px;width:calc(100% - 28px);background:var(--blue2);border:0;color:#fff;
  padding:8px;border-radius:2px;font-weight:600;letter-spacing:.04em}
.primary:hover{background:var(--blue)}
.ghost{background:var(--panel);border:1px solid var(--line2);padding:5px 10px;border-radius:2px;color:var(--tx)}
.ghost:hover{border-color:var(--blue)}
/* contenuto */
.main{overflow:auto;padding:14px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:14px}
.kpi{background:var(--bg2);padding:10px 12px}
.kpi .l{font-size:10px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase}
.kpi .v{font-family:var(--mono);font-size:20px;margin-top:2px}
.kpi.warn .v{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--bg2);border:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.ph .n{font-family:var(--mono);color:var(--tx3);letter-spacing:0}
.pv{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  text-align:left;padding:8px 12px}
.pv:hover{background:var(--panel)} .pv.on{background:rgba(76,144,240,.14);box-shadow:inset 2px 0 var(--blue)}
.pv .r1{display:flex;justify-content:space-between;gap:8px}
.pv .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .num{font-family:var(--mono);font-size:12px;color:var(--tx2);white-space:nowrap}
.pv .num .s{color:var(--red);margin-left:6px}
.bar{height:3px;background:var(--panel2);margin-top:6px}
.bar i{display:block;height:3px;background:var(--blue)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td .o{white-space:normal;max-width:none;display:inline}
table.tab td .o{white-space:nowrap}
td .o:before{display:inline-block;margin-right:5px}
table.att{table-layout:fixed}

tr:hover td{background:rgba(255,255,255,.025)}
.mono{font-family:var(--mono);font-size:11px}
.dim{color:var(--tx3)}
.std{font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--line2);color:var(--gold);
  border-radius:2px;white-space:nowrap}
.stdn{color:var(--tx2);font-size:11px;display:block;margin-top:2px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
.st.fatta:before{background:var(--green)} .st.annullata:before{background:var(--tx3)}
.st.scaduta{color:var(--red)} .st.scaduta:before{background:var(--red)}
.pr-alta{color:var(--red)} .pr-bassa{color:var(--tx3)}
/* link a oggetti */
.o{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.o:before{content:"";width:8px;height:8px;flex:none;border-radius:1px}
.o-azienda:before{background:var(--teal)} .o-contatto:before{background:var(--violet);border-radius:50%}
.o-prodotto:before{background:var(--gold);transform:rotate(45deg) scale(.85)}
.o-trattativa:before{background:var(--green)} .o-attivita:before{background:var(--orange)}
.o-obiettivo:before{background:#F5498B;border-radius:50% 50% 0 50%}
/* scheda oggetto */
.ohead{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--line);margin-bottom:14px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 7px;border:1px solid;border-radius:2px;text-transform:uppercase}
.ohead h1{margin:0;font-size:18px;font-weight:600}
.ohead .sub{color:var(--tx3);font-family:var(--mono);font-size:11px;margin-top:2px}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.prop{background:var(--bg2);padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.prop .v .o{max-width:100%}
.prop .k{font-size:10px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase}
.prop .v{margin-top:2px;word-break:break-word}
.cols3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.list a{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);color:var(--tx)}
.list a:hover{background:var(--panel);text-decoration:none}
.list .meta{color:var(--tx3);font-size:11px;white-space:nowrap}
.empty{padding:14px 12px;color:var(--tx3);font-size:12px}
svg.graph{display:block;width:100%;height:330px;background:
  radial-gradient(circle at 1px 1px,#2a3038 1px,transparent 0) 0 0/18px 18px}
svg.graph .node{cursor:pointer} svg.graph .node:hover circle,svg.graph .node:hover rect{stroke:#fff}
svg.graph text{font:11px -apple-system,sans-serif;fill:var(--tx2)}
/* sequenze */
.seq{padding:12px;border-bottom:1px solid var(--line);overflow-x:auto}
.seq .t{font-size:11px;color:var(--tx3);margin-bottom:8px}
.steps{display:flex;align-items:stretch;gap:0;min-width:max-content}
.step{width:178px;background:var(--panel);border:1px solid var(--line2);padding:8px 9px;border-radius:2px;color:var(--tx);display:block}
.step:hover{border-color:var(--blue);text-decoration:none}
.step.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.step.da-fare{border-style:dashed}
.step .d{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:6px;display:flex;justify-content:space-between}
.step .x{margin-top:5px;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arrow{width:26px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.note{padding:9px 12px;border-bottom:1px solid var(--line)}
.note .m{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-bottom:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.inline{display:flex;gap:6px;margin-top:10px}
input.f,select.f,textarea.f{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--tx);
  padding:6px 8px;border-radius:2px;font:inherit;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--blue)}
/* finestra nuova attività */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding-top:60px;z-index:9}
.modal.on{display:flex}
.box{width:640px;background:var(--bg2);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px}
.form label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-bottom:3px}
.form .w{grid-column:1/3}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.err{color:var(--red);padding:0 14px 10px;font-size:12px}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar2 .seg{margin:0}
.bar2 .seg button{padding:5px 10px}
.bar2 input.f,.bar2 select.f{width:auto;min-width:170px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--blue)}
.gcrumb{font-family:var(--mono);font-size:11px;color:var(--tx3);padding:8px 12px;border-bottom:1px solid var(--line)}
.gcrumb a{color:var(--blue);cursor:pointer}
svg.map{display:block;width:100%;height:560px;background:var(--bg)}
svg.map path{stroke:#4a5361;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
svg.map path:hover{stroke:#fff;stroke-width:1.4}
svg.map path.sel{stroke:#fff;stroke-width:1.8}
svg.map path.dim{opacity:.35}
svg.map text{font:9px var(--mono);fill:#F6F7F9;pointer-events:none;text-anchor:middle}
.know{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);letter-spacing:.06em;
  padding:1px 6px;border-radius:2px;border:1px solid var(--green);color:var(--green);white-space:nowrap}
.know.no{border-color:var(--line2);color:var(--tx3)}
button.know{background:none;cursor:pointer}
.info a{color:var(--tx)} .info a:hover{color:var(--blue)}
.dia{padding:10px 12px;border-bottom:1px solid var(--line)}
.dia .g{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:4px}
.day{font-family:var(--mono);font-size:11px;color:var(--tx3);padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);letter-spacing:.08em}
.gen{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid var(--violet);color:var(--violet)}
.gen.diario{border-color:var(--gold);color:var(--gold)}
.drop{border:1px dashed var(--line2);padding:28px;text-align:center;color:var(--tx2);background:var(--bg)}
svg.lanes{display:block;background:radial-gradient(circle at 1px 1px,#252a31 1px,transparent 0) 0 0/18px 18px}
svg.lanes text{font:11px -apple-system,BlinkMacSystemFont,sans-serif;fill:#F6F7F9}
svg.lanes .t2{fill:#ABB3BF;font-size:10px} svg.lanes .mono{font:10px var(--mono);fill:#F0B726}
svg.lanes a:hover rect{stroke:#fff}
.esito{display:inline-flex;gap:5px;align-items:center;font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid;white-space:nowrap}
.e-vendita{color:#32A467;border-color:#32A467} .e-rifiuto{color:#E76A6E;border-color:#E76A6E}
.e-scelto{color:#EC9A3C;border-color:#EC9A3C} .e-sospesa{color:#ABB3BF;border-color:#5f6b7c} .e-aperto{color:#4C90F0;border-color:#4C90F0;border-style:dashed}
.gen.campagna{border-color:var(--green);color:var(--green)} .gen.opportunita{border-color:var(--teal);color:var(--teal)} .gen.challenge{border-color:var(--violet);color:var(--violet)}
.chipz{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px}
.chipz span{font-size:11px;border:1px solid var(--line2);padding:2px 8px;border-radius:2px;background:var(--bg)}
.chipz b{color:var(--tx3);font-weight:500;margin-right:4px;text-transform:uppercase;font-size:9px;letter-spacing:.08em}
.storia{padding:12px 14px;font-size:14px;line-height:1.6;border-left:3px solid var(--green);margin:12px;background:var(--bg)}
.bell{font-family:var(--mono);font-size:12px;padding:3px 9px;border:1px solid var(--line2);border-radius:2px;color:var(--tx2);white-space:nowrap}
.bell.on{border-color:var(--red);color:#fff;background:rgba(231,106,110,.25)} .bell:hover{text-decoration:none;border-color:var(--blue)}
.warn{border:1px solid var(--orange);background:rgba(236,154,60,.12);color:#f5c58f;padding:8px 12px;font-size:12px;margin:0 14px 10px}
.warn b{color:var(--orange)}
.gia{font-size:10px;font-family:var(--mono);color:var(--orange);border:1px solid rgba(236,154,60,.6);padding:0 5px;border-radius:2px;white-space:nowrap}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line)}
.al .d{font-family:var(--mono);font-size:11px;width:92px;flex:none}
.al.scaduta .d{color:var(--red)} .al.oggi .d{color:var(--orange)}
.tipoal{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid var(--blue);color:var(--blue)}
.tipoal.riattivazione{border-color:var(--violet);color:var(--violet)} .tipoal.promemoria{border-color:var(--tx3);color:var(--tx3)}
table.tab{min-width:1050px;table-layout:auto} table.tab td{font-size:12.5px}
table.tab th{cursor:pointer;user-select:none} table.tab th:hover{color:var(--tx)}
table.tab td.ed{cursor:text} table.tab td.ed:hover{background:rgba(76,144,240,.08);box-shadow:inset 0 0 0 1px rgba(76,144,240,.35)}
table.tab td input,table.tab td select{width:100%;background:var(--bg);border:1px solid var(--blue);color:var(--tx);padding:3px 5px;font:inherit}
table.tab tr.nuova td{background:rgba(50,164,103,.06)}
svg.mm{display:block;width:100%;height:calc(100vh - 170px);min-height:560px;background:radial-gradient(circle at 1px 1px,#252a31 1px,transparent 0) 0 0/22px 22px}
svg.mm text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;fill:#F6F7F9}
svg.mm text.t2{fill:#ABB3BF;font-size:11.5px}
svg.mm text.ramo{font-size:13px;fill:#d3d8de;paint-order:stroke;stroke:#0D1117;stroke-width:3px;font-style:italic}
svg.mm a:hover rect{stroke:#fff;stroke-width:2.5}
.zwrap{position:relative}
.zbtn{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.zbtn button{background:rgba(28,33,39,.92);border:1px solid var(--line2);color:var(--tx);width:30px;height:28px;border-radius:2px;font-size:15px;line-height:1}
.zbtn button:hover{border-color:var(--blue)}
svg.zoomabile{cursor:grab;touch-action:none} svg.zoomabile:active{cursor:grabbing}
.selmap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selmap svg{display:block;width:100%;height:340px;background:var(--bg);border:1px solid var(--line)}
.selmap path{stroke:#4a5361;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.selmap path:hover{stroke:#fff;stroke-width:1.4}
.selmap path.off{opacity:.25;cursor:not-allowed}
.selmap text{font:9px var(--mono);fill:#F6F7F9;pointer-events:none;text-anchor:middle}
.selsum{font-size:12px;margin-top:8px;color:var(--tx2)} .selsum b{color:var(--tx)}
.otree{padding:4px 0}
.onode{border-left:2px solid #F5498B;margin:10px 0 10px 0;background:var(--bg2);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.onode .onode{margin-left:22px;border-left-color:rgba(245,73,139,.55)}
.ohd{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;flex-wrap:wrap}
.ohd .tit{flex:1;min-width:260px}
.ohd .num{font-family:var(--mono);font-size:11px;color:var(--tx2);min-width:210px}
.oini{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 26px;border-top:1px dashed var(--line);font-size:12.5px}
.oini .sp{flex:1}
.luoghi span{font-size:10px;font-family:var(--mono);border:1px solid var(--line2);padding:0 5px;border-radius:2px;margin-right:3px;color:var(--teal)}
.tip{position:fixed;display:none;z-index:20;max-width:340px;background:#252A31;border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.5);
  padding:8px 10px;font-size:12px;line-height:1.5;pointer-events:none}
.tip b{color:var(--tx3);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
svg.lanes text.t3{font-size:10px;fill:#8f99a8;font-style:italic}
svg.lanes .piu{cursor:pointer} svg.lanes .piu:hover rect{stroke:var(--blue)} svg.lanes .piu:hover text{fill:var(--blue)!important}
.fm svg.map{height:430px}
.fmgrid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:14px;align-items:start}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--green);
  padding:9px 14px;display:none;z-index:10}
.op-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.op-col{min-width:0}.op-t{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim,#8a94a6);margin-bottom:8px}
.op{border:1px solid var(--line);border-left:3px solid #5f6b7c;padding:8px 10px;margin-bottom:8px;font-size:12px}
.op-venduto{border-left-color:#3fb950}.op-rifiutato,.op-scelto-altro{border-left-color:#8b949e}.op-in-corso{border-left-color:#4c8dff}
.op-h{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:4px}.op-st{font-weight:400;font-size:11px;color:var(--dim,#8a94a6);white-space:nowrap}
.op-r{margin-top:3px;line-height:1.4}.op-r .k{display:inline-block;width:78px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim,#8a94a6)}
@media(max-width:1100px){.op-grid{grid-template-columns:1fr}}
.navsub{display:block;font-size:10px;color:var(--dim,#8a94a6);letter-spacing:.02em;margin-top:1px}
.iniguida{margin-bottom:14px}.ig3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}

/* ===================== TEMA ONTOLOGY (stile Palantir) ===================== */
:root{
  --bg:#0D1117; --bg2:#131A23; --panel:#18202B; --panel2:#1F2834; --line:#232D3A; --line2:#2E3A4A;
  --tx:#E6EBF2; --tx2:#A3AFC0; --tx3:#6B788B;
  --blue:#4C90F0; --blue2:#2D72D2; --acc:#4C90F0; --acc2:#8ABBFF; --amb:#E1A94E;
  --green:#3DB37A; --orange:#E58F3C; --red:#E5636A; --teal:#3FA6DA; --violet:#A797F7; --gold:#E8BE55;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
html,body{background:var(--bg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(76,144,240,.07),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(167,151,247,.05),transparent 60%),var(--bg)}
.app{grid-template-rows:2px 48px 1fr}
.classif{grid-column:1/3;background:linear-gradient(90deg,#2D72D2,#8ABBFF 40%,#A797F7 70%,#2D72D2);font-size:0;overflow:hidden}
.top{background:rgba(19,26,35,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--sans);font-weight:600;letter-spacing:.24em;font-size:11.5px;color:var(--tx)}
.logo b{color:var(--acc);font-weight:500}
.logo .lv{color:var(--tx3);font-weight:500;letter-spacing:.18em;margin-left:10px;padding-left:10px;border-left:1px solid var(--line2)}
.search input{background:rgba(13,17,23,.85);border-color:var(--line2);border-radius:4px;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(76,144,240,.18)}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.clock b{color:var(--tx);font:500 12px var(--mono);letter-spacing:.06em} .clock span{font:9.5px var(--mono);color:var(--tx3);letter-spacing:.08em}
.side{background:rgba(19,26,35,.92);border-right:1px solid var(--line)}
.area{font-family:var(--sans);color:var(--tx3);letter-spacing:.22em;font-size:9.5px;border-bottom:0;margin-top:18px}
.nav{border-radius:0 4px 4px 0;margin-right:8px;width:calc(100% - 8px);transition:background .12s,color .12s}
.nav:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,rgba(76,144,240,.18),rgba(76,144,240,.04));border-left-color:var(--acc);color:#fff}
.nav.on .ic{color:var(--acc2)}
.nav.nuova,.nav.nuova .ic{color:var(--acc2)} .nav.nuova:hover{background:rgba(76,144,240,.12);color:#fff}
.nav.home{font-weight:600;color:var(--tx);letter-spacing:.02em}
.panel,.ohead{background:linear-gradient(180deg,rgba(31,40,52,.55),rgba(24,32,43,.55)) ,var(--bg2);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);overflow:hidden}
.ph{font-family:var(--sans);font-weight:600;letter-spacing:.16em;font-size:10px;color:var(--tx2);background:rgba(255,255,255,.015);border-bottom-color:var(--line)}
.ph{justify-content:flex-start} .ph .n,.ph>button:last-child{margin-left:auto}
.ph .n{font-family:var(--mono);color:var(--tx3);letter-spacing:.04em}
th{background:rgba(19,26,35,.95);letter-spacing:.14em;color:var(--tx3);border-bottom-color:var(--line)}
td{border-bottom-color:var(--line)}
tr:hover td{background:rgba(76,144,240,.045)}
.primary{background:linear-gradient(180deg,#4C90F0,#2D72D2);color:#fff;border-radius:4px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 14px rgba(45,114,210,.35)}
.primary:hover{background:linear-gradient(180deg,#68A6FF,#3B82E6)}
.ghost{background:rgba(31,40,52,.7);border-color:var(--line2);border-radius:4px;transition:border-color .12s,background .12s}
.ghost:hover{border-color:var(--acc);background:rgba(76,144,240,.1)}
input.f,select.f,textarea.f{background:rgba(13,17,23,.8);border-color:var(--line2);border-radius:4px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(76,144,240,.15)}
.seg{border-radius:4px} .seg button{background:rgba(13,17,23,.8)} .seg button.on{background:var(--blue2);color:#fff}
.ohead h1{font-weight:600;letter-spacing:-.005em;font-size:20px}
.badge{letter-spacing:.16em;border-radius:3px}
.std{color:var(--gold);border-color:rgba(232,190,85,.35);background:rgba(232,190,85,.06)}
.kpi .v{font-family:var(--mono)}
svg.graph,svg.lanes,svg.mm{background:radial-gradient(circle at 1px 1px,rgba(163,175,192,.10) 1px,transparent 0) 0 0/20px 20px}
svg.map,.selmap svg{background:rgba(13,17,23,.9);border-radius:4px}
.tip{background:rgba(24,32,43,.97);border-color:var(--line2);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.toast{background:var(--panel2);border-left-color:var(--acc);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.modal{background:rgba(5,8,12,.6);backdrop-filter:blur(3px)}
.box{border-radius:8px;border-color:var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.bell{border-radius:4px} .bell.on{border-color:rgba(229,99,106,.7);background:rgba(229,99,106,.14)}
.op{border-radius:4px;background:rgba(13,17,23,.35)}
.esito,.gen,.tipoal,.know{border-radius:3px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#273241;border:3px solid var(--bg);border-radius:6px} ::-webkit-scrollbar-thumb:hover{background:#34445a}
*:focus-visible{outline:2px solid rgba(76,144,240,.6);outline-offset:1px}
a.o{color:#D6DEEA} a.o:hover{color:var(--acc2);text-decoration:none}
a{color:var(--acc2)}
.navsub{font-size:9.5px;color:var(--tx3)}
.selvert .selmap{grid-template-columns:1fr}.selvert .selmap svg{height:250px}
.selvert .selsum{font-size:11.5px;line-height:1.5}
.kbd{display:inline-block;font:500 10px/1 var(--mono);padding:3px 5px;border:1px solid var(--line2);border-radius:3px;color:var(--tx3);background:rgba(13,17,23,.6);margin-left:auto}

/* ---------- PLANCIA DI COMANDO ---------- */
.cmd-kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ck{position:relative;border-radius:6px;overflow:hidden;background:rgba(24,32,43,.7);border:1px solid var(--line2);padding:10px 12px 11px;text-align:left;cursor:pointer;
  transition:border-color .12s,transform .12s,box-shadow .12s;color:var(--tx)}
.ck:hover{border-color:var(--acc);box-shadow:0 0 18px rgba(76,144,240,.12);transform:translateY(-1px)}
.ck .l{font:600 9.5px var(--sans);letter-spacing:.18em;color:var(--tx3);text-transform:uppercase}
.ck .v{font:500 26px/1.15 var(--sans);letter-spacing:-.01em;margin-top:4px;color:var(--tx)}
.ck .s{font:11px var(--sans);color:var(--tx3);margin-top:3px}
.ck:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--line2)} .ck.blu:before{background:var(--acc)}
.ck.rosso:before{background:var(--red)} .ck.rosso .v{color:var(--red)}
.ck.ambra:before{background:var(--amb)} .ck.ambra .v{color:var(--amb)}
.ck.verde:before{background:var(--green)} .ck.verde .v{color:#7fdcab}
.cmd-act{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ca{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(31,40,52,.6);border:1px solid var(--line2);color:var(--tx);
  font:500 13px var(--sans);letter-spacing:.01em;transition:all .12s;text-align:left;border-radius:6px}
.ca:hover{border-color:var(--acc);color:#fff;box-shadow:inset 0 0 0 1px rgba(76,144,240,.25),0 0 20px rgba(76,144,240,.1)}
.ca.prim{background:linear-gradient(180deg,#4C90F0,#2D72D2);color:#fff;border-color:#3B82E6;box-shadow:0 6px 18px rgba(45,114,210,.35)} .ca.prim:hover{background:linear-gradient(180deg,#68A6FF,#3B82E6);color:#fff}
.ca .ic{font-size:15px;width:18px;text-align:center;color:var(--acc2)} .ca.prim .ic{color:#fff} .ca.prim .kbd{color:#d8e8ff;border-color:rgba(255,255,255,.35);background:transparent}
.cmd-g{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.cmd-g+.cmd-g{margin-top:14px}
.ag-h{font:600 9.5px var(--sans);letter-spacing:.18em;padding:7px 12px;background:rgba(13,17,23,.55);border-bottom:1px solid var(--line);color:var(--tx3)}
.ag-h.rosso{color:var(--red)} .ag-h.ambra{color:var(--amb)}
.ag{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);transition:background .1s}
.ag:hover{background:rgba(76,144,240,.045)}
.ag .q{font:11px var(--mono);color:var(--tx2)} .ag.scad .q{color:var(--red)} .ag.oggi .q{color:var(--amb)}
.ag .w{min-width:0} .ag .w a.t{color:var(--tx);font-weight:500} .ag .w a.t:hover{color:var(--acc2)}
.ag .w .c{font-size:11.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .ok{background:rgba(13,17,23,.5);border:1px solid var(--line2);border-radius:4px;color:var(--tx2);font:500 11px var(--sans);padding:5px 10px;transition:all .12s}
.ag .ok:hover{border-color:var(--acc);color:var(--acc2);background:rgba(76,144,240,.08)}
.ob{padding:10px 12px;border-bottom:1px solid var(--line)}
.ob .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ob .p{font:11px var(--mono);color:var(--tx2);white-space:nowrap}
.trk{position:relative;height:6px;border-radius:3px;overflow:hidden;background:rgba(13,17,23,.55);border:1px solid var(--line2);margin-top:7px}
.trk i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#2D72D2,#8ABBFF)} .trk u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(225,169,78,.55) 0 3px,transparent 3px 6px)}
.ob .lg{font:11px var(--sans);color:var(--tx3);margin-top:6px}
.rs{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.rs .e{font:600 9.5px var(--sans);letter-spacing:.12em;border-radius:3px;padding:2px 6px;border:1px solid;white-space:nowrap;min-width:86px;text-align:center}
.rs .e.vendita{color:#7fdcab;background:rgba(61,179,122,.08)} .rs .e.rifiuto{color:var(--red)} .rs .e.scelto{color:var(--orange)} .rs .e.sospesa{color:var(--tx3)}
.rs .w{flex:1;min-width:0} .rs .w .c{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .v{font:11px var(--mono);color:var(--tx2);white-space:nowrap}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.it .c{font-size:11px;color:var(--tx3)} .it .n{font:11px var(--mono);color:var(--tx2);text-align:right;white-space:nowrap}
.hint{font:10.5px var(--sans);color:var(--tx3);letter-spacing:.08em;margin:-4px 0 12px}
@media(max-width:1200px){.cmd-kpi{grid-template-columns:repeat(3,1fr)}.cmd-g{grid-template-columns:1fr}.cmd-act{grid-template-columns:repeat(2,1fr)}}

/* verifica obiettivi */
.sto{display:inline-block;font:600 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:10px;border:1px solid;white-space:nowrap}
.sto.ok{color:#7fdcab;border-color:rgba(61,179,122,.5);background:rgba(61,179,122,.1)} .sto.blu{color:var(--acc2);border-color:rgba(76,144,240,.5);background:rgba(76,144,240,.1)}
.sto.amb{color:var(--amb);border-color:rgba(225,169,78,.5);background:rgba(225,169,78,.1)} .sto.ross{color:#ff9a9f;border-color:rgba(229,99,106,.5);background:rgba(229,99,106,.1)}
.sto.gri{color:var(--tx3);border-color:var(--line2)}
.vb{position:relative;height:8px;border-radius:4px;background:rgba(13,17,23,.7);border:1px solid var(--line2);margin:8px 0 4px}
.vb.alta{height:16px;border-radius:5px;margin:14px 0 6px}
.vb i{position:absolute;top:0;bottom:0;left:0} .vb i.v{background:linear-gradient(90deg,#2D72D2,#8ABBFF);border-radius:4px 0 0 4px}
.vb i.p{background:rgba(138,187,255,.38)} .vb i.a{background:repeating-linear-gradient(45deg,rgba(225,169,78,.55) 0 3px,transparent 3px 7px)}
.vb b.t{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6)}
.vb b.t span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font:600 9px var(--sans);letter-spacing:.1em;color:var(--tx2);text-transform:uppercase}
.vb:not(.alta) b.t span{display:none}
.vleg{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--tx3);margin:4px 0 6px}
.vleg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.vleg i.v{background:linear-gradient(90deg,#2D72D2,#8ABBFF)} .vleg i.p{background:rgba(138,187,255,.38)}
.vleg i.a{background:repeating-linear-gradient(45deg,rgba(225,169,78,.7) 0 2px,transparent 2px 4px)} .vleg i.e{background:rgba(13,17,23,.7);border:1px solid var(--line2)} .vleg i.t{width:2px;background:#fff}
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.vm{background:var(--bg2);padding:12px 14px} .vm .l{font:600 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.vm .v{font:500 22px/1.2 var(--sans);margin-top:4px;letter-spacing:-.01em} .vm .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.vm.blu .v{color:var(--acc2)} .vm.amb .v{color:var(--amb)} .vm.ross .v{color:#ff9a9f} .vm.ok .v{color:#7fdcab}
.vgiu{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:13px} .vgiu ul{margin:6px 0 0;padding-left:18px;color:var(--tx2)} .vgiu li{margin:2px 0}
.vdue{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.vdue>div{background:var(--bg2);padding:12px 14px}
.vt{font:600 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.fun{display:grid;grid-template-columns:170px 1fr 28px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.fun .fb{height:8px;background:rgba(13,17,23,.7);border-radius:4px;overflow:hidden} .fun .fb i{display:block;height:100%;background:linear-gradient(90deg,#2D72D2,#8ABBFF);border-radius:4px}
.fun .fn{font:12px var(--mono);text-align:right;color:var(--tx2)}
.fchi{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px} .fchi .ok{color:#7fdcab} .fchi .ross{color:#ff9a9f} .fchi .amb{color:var(--amb)} .fchi .gri{color:var(--tx3)}
.vatt{display:grid;grid-template-columns:1fr 1fr;gap:8px} .vatt div{background:rgba(13,17,23,.45);border:1px solid var(--line);border-radius:5px;padding:8px 10px}
.vatt b{display:block;font:500 20px var(--sans)} .vatt span{font-size:11px;color:var(--tx3)} .vatt .ross b{color:#ff9a9f} .vatt .blu b{color:var(--acc2)}
table.vtab{border-top:1px solid var(--line)} table.vtab td{font-size:12.5px;vertical-align:middle} table.vtab tr.chiuso td{opacity:.6}
.pr{display:inline-block;width:52px;height:5px;background:rgba(13,17,23,.7);border-radius:3px;overflow:hidden;margin-right:6px;vertical-align:middle}
.pr i{display:block;height:100%;background:var(--acc)}
.vcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:12px} .vcs.uno{grid-template-columns:1fr}
.vc{display:block;background:rgba(13,17,23,.4);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--tx);transition:border-color .12s,background .12s}
.vc:hover{border-color:var(--acc);background:rgba(76,144,240,.06);text-decoration:none}
.vc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start} .vc-t{font-weight:500}
.vc-n{display:flex;align-items:baseline;gap:10px;margin-top:6px;font-size:12px;color:var(--tx2)} .vc-n .big{font:500 22px var(--sans);color:var(--tx)} .vc-n b{color:var(--tx)}
.vc-f{font-size:11px;color:var(--tx3)}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(2,1fr)}.vdue{grid-template-columns:1fr}}

/* ===== legenda unica: stessa forma e stesso colore ovunque ===== */
:root{--teal:#36C2D6;--violet:#A28BF5;--gold:#C3CEDD;--orange:#E1B84E;--amb:#E1B84E;--green:#3DB37A;--red:#E5636A;
  --c-ob:#E06EC5;--c-in:#4C90F0;--c-ce:#36C2D6;--c-pe:#A28BF5;--c-pr:#C3CEDD;--c-at:#8796AE}
.o:before{border-radius:0;transform:none;clip-path:none;width:9px;height:9px}
.o-obiettivo:before{background:var(--c-ob);clip-path:polygon(50% 0,100% 92%,0 92%)}
.o-trattativa:before{background:var(--c-in);width:11px;clip-path:polygon(0 10%,62% 10%,100% 50%,62% 90%,0 90%)}
.o-azienda:before{background:var(--c-ce);border-radius:1.5px;width:8px;height:8px}
.o-contatto:before{background:var(--c-pe);border-radius:50%}
.o-prodotto:before{background:var(--c-pr);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.o-attivita:before{background:var(--c-at);width:11px;height:6px;border-radius:2px}
.legsem span{display:flex;align-items:center;gap:7px;color:var(--tx2)} .legsem i{width:9px;height:9px;border-radius:50%;flex:none}
/* stato: verde venduto · rosso non andato · giallo attenzione · blu in corso */
.e-vendita{color:#7fdcab;border-color:#3DB37A} .e-rifiuto,.e-scelto{color:#ff9a9f;border-color:#E5636A} .e-sospesa{color:#E1B84E;border-color:#E1B84E} .e-aperto{color:var(--acc2);border-color:var(--acc)}
.st:before{background:var(--tx3)} .st.fatta:before{background:var(--acc)} .st.scaduta{color:#E1B84E} .st.scaduta:before{background:#E1B84E}
.pr-alta{color:#E1B84E}
.ck.ambra:before{background:#E1B84E} .ck.ambra .v{color:#E1B84E} .ck.blu .v{color:var(--tx)}
.ag-h.ambra{color:#E1B84E} .ag-h.blu{color:var(--acc2)} .ag.scad .q{color:#E1B84E} .ag.oggi .q{color:var(--acc2)}
.al.scaduta .d{color:#E1B84E} .al.oggi .d{color:var(--acc2)}
.bell.on{border-color:rgba(225,184,78,.7);background:rgba(225,184,78,.14);color:#E1B84E}
.gia{color:#E1B84E;border-color:rgba(225,184,78,.55)} .warn{border-color:#E1B84E;background:rgba(225,184,78,.1);color:#f0d690} .warn b{color:#E1B84E}
.rs .e.scelto,.rs .e.rifiuto{color:#ff9a9f} .rs .e.sospesa{color:#E1B84E}
.sto.amb{color:#E1B84E;border-color:rgba(225,184,78,.5);background:rgba(225,184,78,.1)}

.esb-b.ann .i{background:rgba(229,99,106,.12);color:#E5636A} .esb-b.ann:hover,.esb-b.ann.pronto{border-color:#E5636A} .esb-b.ann.pronto{background:rgba(229,99,106,.12)}

/* pannelli dell'esito: compaiono solo dopo la scelta */
.esp{display:none;margin-top:10px;padding:12px 14px;border-radius:8px;border:1px solid var(--line2);background:rgba(13,17,23,.35)}
.esp.on{display:grid;gap:9px;animation:apri .14s ease-out} @keyframes apri{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.esp label{font-size:12.5px;font-weight:600;color:var(--tx);text-transform:none;letter-spacing:0}
.esp.fatta{border-color:#2D72D2;background:rgba(45,114,210,.07)} .esp.nores{border-color:rgba(225,184,78,.7)} .esp.rim{border-color:rgba(76,144,240,.6)} .esp.ann{border-color:rgba(229,99,106,.7)}

.esb-ok.fatta{background:linear-gradient(180deg,#4C90F0,#2D72D2)} .esb-ok.fatta:hover,.esb-ok.fatta:active{background:linear-gradient(180deg,#4C90F0,#2D72D2);filter:brightness(1.08)}
.esb-ok.nores{background:#B88A1B} .esb-ok.rim{background:#3B6FB8} .esb-ok.ann{background:#C2343C}
html.chiaro .esp{background:#FFFEFB} html.chiaro .esp.fatta{background:#F2F7FE}
.dc-e{padding:0 12px 12px 118px}

/* calendario */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.cw-h,.cw-b{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.cw-h>div{padding:8px 6px;border-left:1px solid var(--line);font-size:12px;text-transform:capitalize} .cw-h>div.oggi b{color:var(--acc2)}
.cw-ore>div{height:44px;font:10px var(--mono);color:var(--tx3);text-align:right;padding-right:6px;transform:translateY(-6px)}
.cw-d{position:relative;border-left:1px solid var(--line);min-height:528px} .cw-d.oggi{background:rgba(76,144,240,.05)} .cw-d.su,.cm-d.su{background:rgba(76,144,240,.14)}
.cw-l{height:44px;border-top:1px solid var(--line)}
.cs{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:11px;line-height:1.25;overflow:hidden;cursor:grab;
  background:color-mix(in srgb, var(--c) 22%, transparent);border-left:3px solid var(--c);color:var(--tx)}
.cs b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cs span{display:block;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs:hover{box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:2} .cs.fatta{opacity:.55;cursor:default;background:repeating-linear-gradient(45deg,color-mix(in srgb, var(--c) 14%, transparent) 0 6px,transparent 6px 12px)}
.cs.scad{box-shadow:inset 0 0 0 1px #E1B84E}
.cm-h,.cm-b{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))} .cm-h>div{padding:6px;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}

.cg{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px} .cg i{display:block;height:100%;background:var(--acc)} .cg.over i{background:#E5636A}

.al-r{display:grid;grid-template-columns:10px minmax(0,1fr) 70px 82px;gap:8px;align-items:center;padding:6px 12px;font-size:12px;border-bottom:1px solid var(--line)}

.al-v{font:11px var(--mono);color:var(--tx2);text-align:right}
@media(max-width:1200px){.cal{grid-template-columns:1fr}}
.cw-all>div{border-left:1px solid var(--line);border-bottom:1px solid var(--line2);min-height:30px;padding:3px;display:grid;gap:3px;align-content:start}
.cw-all .cs{position:static;padding:2px 5px} .cw-all .cs span{display:none} .cw-ore-t{font:9.5px var(--sans);color:var(--tx3);text-align:right;padding:4px 6px!important;border-left:0!important}

<body>
<div class="app">
  <div class="classif"></div>
  <header class="top">
    <div class="logo">◆ SOMAMED <b>//</b> CRM<span class="lv">ONTOLOGY</span></div>
    <div class="crumb" id="crumb"></div>
    <div class="search"><input id="q" placeholder="Cerca centri, persone, prodotti o per significato…  (premi /)"></div>
    <a href="#/utenti" class="bell ut" title="Utente che sta lavorando: cambia da Strumenti → Utenti">◍ <span id="utTop">Stefano</span></a>
    <a id="bell" href="#/allerte" class="bell" title="Allerte di oggi e scadute">⏰ <span id="bellN">0</span></a>

  </header>

  <aside class="side">
    <div id="navHome"></div>
    <div class="area">OPERATIONAL</div>
    <button class="nav nuova" onclick="apriNuova()"><span class="ic">＋</span>Nuova attività</button>
    <div id="navOp"></div>
    <div class="area">DATI</div>
    <div id="navDati"></div>
    <div class="area">VISTE</div>
    <div id="navViste"></div>
    <button class="nav" id="espToggle" onclick="toggleEsplora()"><span class="ic">▸</span>Esplora le attività per…</button>
    <div id="espBox" style="display:none">
      <div id="dims"></div>
      <div class="sect">Stato</div>
      <div class="seg" id="seg"></div>
      <div class="sect" id="chipsT" style="display:none">Filtri attivi</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="area">STRUMENTI</div>
    <div id="navStr"></div>
    <div class="sect">Aspetto</div>
    <div class="seg" id="segTema"><button data-t="scuro" onclick="impostaTema('scuro')">Sfondo nero</button><button data-t="chiaro" onclick="impostaTema('chiaro')">Sfondo bianco</button></div>
    <div class="sect">Legenda</div>
    <div style="padding:4px 14px 12px;display:grid;gap:5px;font-size:12px">
      <span class="o o-obiettivo">Obiettivo</span><span class="o o-trattativa">Iniziativa</span>
      <span class="o o-azienda">Centro</span><span class="o o-contatto">Persona</span>
      <span class="o o-prodotto">Prodotto</span><span class="o o-attivita">Attività</span>
    </div>

    <div style="padding:4px 14px 18px;display:grid;gap:5px;font-size:12px" class="legsem">
      <span><i style="background:#3DB37A"></i>Venduto, raggiunto</span><span><i style="background:#E5636A"></i>Non andato: rifiuto, scelto altro</span>
      <span><i style="background:#E1B84E"></i>Attenzione: scadute, allerte, sospeso</span><span><i style="background:#4C90F0"></i>In corso</span>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="ph">Nuova attività <span class="n" id="mPrec"></span></div>
    <div class="form">
      <div><label>Attività standard</label><select class="f" id="fStd"></select></div>
      <div><label>Canale</label><select class="f" id="fTipo">
        <option>chiamata</option><option>email</option><option>riunione</option><option>follow-up</option>
        <option>offerta</option><option>demo</option><option>visita</option><option selected>compito</option></select></div>
      <div class="w"><label>Descrizione</label><textarea class="f" id="fDesc" rows="2"></textarea></div>
      <div><label>Centro</label><select class="f" id="fAz"></select></div>
      <div><label>Persona</label><select class="f" id="fCt"></select></div>
      <div><label>Prodotto</label><select class="f" id="fPr"></select></div>
      <div><label>Iniziativa (marketing o commerciale)</label><select class="f" id="fTr"></select></div>
      <div><label>Scadenza</label><input class="f" id="fScad" type="datetime-local"></div>
      <div><label>Priorità</label><select class="f" id="fPri"><option>alta</option><option selected>media</option><option>bassa</option></select></div>
    </div>
    <div id="fWarn"></div>
    <div class="err" id="fErr"></div>
    <div class="foot"><button class="ghost" onclick="chiudiNuova()">Annulla</button>
      <button class="primary" style="width:auto;margin:0;padding:6px 16px" onclick="salvaNuova()">Salva</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="tip" class="tip"></div>

<script src="config.js"></script>
<script>
const DIMS = [
  ["centro","Centro","▦"],["regione","Regione","◎"],["provincia","Provincia","◌"],["natura","Pubblico / privato","◐"],
  ["dimensione","Dimensione centro","▥"],["professionalita","Professionalità","◉"],
  ["bu","Business unit","▤"],["prodotto","Prodotto","◆"],["standard","Attività standard","≡"],["contatto","Persona","●"]];
const NAV_OP = [["oggi","Piano del giorno","☀"],["calendario","Calendario e carico","▦"],["obiettivi","Obiettivi · area e budget","◎"],["budget","<span>Budget strategico<span class=\"navsub\">valore dei centri · piano tattico</span></span>","▤"],["offerte","Offerte economiche","€"],["iniziative","<span>Iniziative<span class=\"navsub\">marketing · commerciale</span></span>","⚑"],
  ["diario","Diario e agenda","✎"],["dacontattare","Persone da contattare","☎"],["allerte","Allerte","⏰"]];
const NAV_DATI = [["contatti","Contatti","●"],["centri","Centri e mappa","⌖"],["prodotti","Prodotti","◆"]];
const NAV_STR = [["importa","Importa da CSV","⇪"],["utenti","Utenti","◍"],["dati","Dati e collegamento","⛁"]];
const NAV_VISTE = [["mappa","Mappa mentale","✺"],["grafo","Percorsi delle iniziative","⊶"]];
const DIMLAB = Object.fromEntries(DIMS.map(d=>[d[0],d[1]]));
const STATI = [["aperte","Aperte"],["scadute","Scadute"],["fatte","Fatte"],["tutte","Tutte"]];
const PREF = {azienda:"AZI",contatto:"PER",prodotto:"PRD",trattativa:"INI",attivita:"ACT",obiettivo:"OBI"};
const GENERI = {marketing:"marketing", commerciale:"commerciale", campagna:"marketing", challenge:"marketing", opportunita:"commerciale"};
const NOMEGEN = (g, maiusc) => { const n = GENERI[g]||g||"iniziativa"; return maiusc ? n[0].toUpperCase()+n.slice(1) : n; };
const NOMI = {azienda:"Centro",contatto:"Persona",prodotto:"Prodotto",trattativa:"Iniziativa",attivita:"Attività",obiettivo:"Obiettivo"};
const COL = {obiettivo:"#E06EC5", trattativa:"#4C90F0", azienda:"#36C2D6", contatto:"#A28BF5", prodotto:"#C3CEDD", attivita:"#8796AE"};
const SEM = {ok:"#3DB37A", no:"#E5636A", att:"#E1B84E", corso:"#4C90F0", neutro:"#8A96A8"};
/* stessa forma della legenda, ovunque: obiettivo ▲ · iniziativa ➤ · centro ■ · persona ● · prodotto ◆ · attività ▬ */
function forma(t, cx, cy, r, fill, stroke="#0D1117", sw=1.5, extra=""){
  const c = fill || COL[t] || "#E6EBF2", a = `fill="${c}" stroke="${stroke}" stroke-width="${sw}" ${extra}`, P = pts => `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" ${a}/>`;
  if(t==="obiettivo") return P([[cx,cy-r*1.1],[cx+r*1.05,cy+r*.8],[cx-r*1.05,cy+r*.8]]);
  if(t==="trattativa") return P([[cx-r,cy-r*.8],[cx+r*.35,cy-r*.8],[cx+r*1.1,cy],[cx+r*.35,cy+r*.8],[cx-r,cy+r*.8]]);
  if(t==="azienda") return `<rect x="${cx-r*.85}" y="${cy-r*.85}" width="${r*1.7}" height="${r*1.7}" rx="${r*.2}" ${a}/>`;
  if(t==="prodotto") return P([[cx,cy-r*1.1],[cx+r*1.1,cy],[cx,cy+r*1.1],[cx-r*1.1,cy]]);
  if(t==="attivita") return `<rect x="${cx-r*1.1}" y="${cy-r*.6}" width="${r*2.2}" height="${r*1.2}" rx="${r*.35}" ${a}/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
}
let META = null, ETICH = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cod = (t,id) => `${PREF[t]}-${String(id).padStart(4,"0")}`;
const L = (t,id,lab) => id==null ? '<span class="dim">—</span>' :
  `<a class="o o-${t}" href="#/o/${t}/${id}" title="${esc(lab)}">${esc(lab || cod(t,id))}</a>`;
const eur = v => v==null ? "—" : new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);
const TZ = {timeZone:"Europe/Rome"};
function dt(s, ora=true){ if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return s;
  const g = new Intl.DateTimeFormat("it-IT",{...TZ,day:"2-digit",month:"2-digit",year:"numeric"}).format(d);
  const h = new Intl.DateTimeFormat("it-IT",{...TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  return ora && h!=="00:00" ? `${g} ${h}` : g; }
const stato = a => a.scaduta ? '<span class="st scaduta">scaduta</span>' : `<span class="st ${a.stato==='fatta'?'fatta':a.stato==='annullata'?'annullata':''}">${esc(a.stato)}</span>`;
const stdTag = a => a.codice_standard ? `<span class="std">${esc(a.codice_standard)}</span><span class="stdn">${esc(a.standard)}</span>` : '<span class="dim">—</span>';
const LS = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
let _ut = null, _tema = null;
const UTENTE = () => _ut || LS.get("crm_utente") || "Stefano";
const TEMA = () => _tema || LS.get("crm_tema") || "scuro";
function impostaTema(t){ _tema = t; LS.set("crm_tema", t); document.documentElement.classList.toggle("chiaro", t==="chiaro");
  document.querySelectorAll("#segTema button").forEach(b=>b.classList.toggle("on", b.dataset.t===t)); }
function impostaUtente(n){ _ut = n; LS.set("crm_utente", n); toast(`Ora lavori come ${n}`); render(); }
document.documentElement.classList.toggle("chiaro", TEMA()==="chiaro");
/* l'interfaccia legge i dati dal servizio dati: di solito lo stesso computer, oppure un server indicato in Strumenti */
/* indirizzo del servizio dati: quello scelto in Strumenti, altrimenti quello di config.js */
const API = () => (LS.get("crm_api") || window.CRM_API || "").replace(/\/+$/,""), CHIAVE = () => LS.get("crm_token")||"";
async function api(u, opt={}){ const h = {...(opt.headers||{})}; if(CHIAVE()) h["X-CRM-Token"] = CHIAVE();
  let r, prova = 0;
  const leggi = !opt.method || opt.method === "GET";
  for(;;){ /* le letture si ritentano da sole se il servizio è momentaneamente irraggiungibile */
    try{ r = await fetch((u.startsWith("/") ? API() : "") + u, {...opt, headers:h}); }
    catch(e){ if(leggi && prova++ < 2){ await new Promise(ok=>setTimeout(ok, 800*prova)); continue; }
              throw new Error("Servizio dati non raggiungibile: è acceso? (bash avvia.sh)"); }
    if(r.status === 503 && leggi && prova++ < 2){ await new Promise(ok=>setTimeout(ok, 1500*prova)); continue; }
    break; }
  if(!r.ok){ let m; try{m=(await r.json()).detail}catch(e){} throw new Error(m||r.statusText);} return r.json(); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.display="none", m.length>60?6000:2600); }

/* ---------- stato di navigazione ---------- */
function toggleEsplora(){ const b=$("#espBox"); const ap = b.style.display==="none"; b.style.display = ap?"":"none"; $("#espToggle .ic").textContent = ap?"▾":"▸"; if(ap && parseHash().parts[0]!=="esplora") esplora({}); }
function parseHash(){ const h = location.hash.slice(1) || "/comando"; const [path, qs] = h.split("?");
  return {parts: path.split("/").filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs||""))}; }
function vai(parts, q){ const qs = new URLSearchParams(Object.entries(q||{}).filter(([k,v])=>v!==""&&v!=null)).toString();
  location.hash = "/" + parts.join("/") + (qs ? "?" + qs : ""); }
function esplora(mod){ const {parts,q} = parseHash(); const base = parts[0]==="esplora" ? q : {dim:"centro",stato:"aperte"};
  const n = {...base, ...mod}; Object.keys(n).forEach(k=>n[k]==null&&delete n[k]); vai(["esplora"], n); }

function sidebar(){
  const {parts,q} = parseHash(); const inE = parts[0]==="esplora"; const dim = q.dim||"centro"; const st = q.stato||"aperte";
  const nv = arr => arr.map(([k,l,ic]) => `<button class="nav ${parts[0]===k||(k==="iniziative"&&parts[0]==="nuova")?'on':''}" onclick="location.hash='/${k}'"><span class="ic">${ic}</span>${l}</button>`).join("");
  $("#navHome").innerHTML = nv([["comando","Plancia di comando","◈"]]).replace('class="nav','class="nav home');
  $("#navOp").innerHTML = nv(NAV_OP); $("#navStr").innerHTML = nv(NAV_STR);
  document.querySelectorAll("#segTema button").forEach(b=>b.classList.toggle("on", b.dataset.t===TEMA()));
  $("#utTop").textContent = UTENTE(); $("#navDati").innerHTML = nv(NAV_DATI); $("#navViste").innerHTML = nv(NAV_VISTE);
  if(inE){ $("#espBox").style.display=""; $("#espToggle").classList.add("on"); $("#espToggle .ic").textContent="▾"; }
  else { $("#espToggle").classList.remove("on"); }
  $("#dims").innerHTML = DIMS.map(([k,l,ic]) =>
    `<button class="nav sub ${inE&&dim===k?'on':''}" onclick="esplora({dim:'${k}'})"><span class="ic">${ic}</span>${l}</button>`).join("");
  $("#seg").innerHTML = STATI.map(([k,l]) => `<button class="${st===k?'on':''}" onclick="esplora({stato:'${k}'})">${l}</button>`).join("");
  const att = inE ? DIMS.filter(([k])=>q[k]) : [];
  $("#chipsT").style.display = att.length ? "" : "none";
  $("#chips").innerHTML = att.map(([k,l]) => `<div class="chip"><div><span>${l}</span>${esc(ETICH[k+":"+q[k]]||q[k])}</div>
     <button title="Togli" onclick="esplora({${k}:null})">✕</button></div>`).join("");
}

/* ---------- vista ESPLORA ---------- */
async function vistaEsplora(q){
  const dim = q.dim || "centro", st = q.stato || "aperte";
  const filt = Object.fromEntries(DIMS.map(([k])=>[k,q[k]]).filter(([k,v])=>v));
  const qs = new URLSearchParams({stato:st, ...filt}).toString();
  const [pv, lista] = await Promise.all([api(`/api/pivot/${dim}?${qs}`), api(`/api/attivita?${qs}`)]);
  pv.righe.forEach(r => ETICH[dim+":"+(r.chiave??"__nessuno__")] = r.etichetta); sidebar();
  const max = Math.max(1, ...pv.righe.map(r=>r.totale));
  const c = META.conteggi;

/* ---------- grafo dei collegamenti ---------- */
function grafo(centro, gruppi){
  const W=640,H=330,cx=W/2,cy=H/2; const nodi=[];
  gruppi.forEach(([t,arr])=>arr.slice(0,10).forEach(o=>nodi.push({t,id:o.id,lab:o.nome||o.titolo||cod(t,o.id)})));
  const n = nodi.length; let s = "";
  nodi.forEach((o,i)=>{ const ang = -Math.PI/2 + 2*Math.PI*i/Math.max(n,1); const r = n>12?135:120;
    o.x = cx + r*1.9*Math.cos(ang); o.y = cy + r*Math.sin(ang);
    s += `<line x1="${cx}" y1="${cy}" x2="${o.x}" y2="${o.y}" stroke="${COL[o.t]}" stroke-opacity=".35"/>`; });
  nodi.forEach(o=>{ const lab = o.lab.length>26 ? o.lab.slice(0,25)+"…" : o.lab;
    s += `<g class="node" onclick="location.hash='/o/${o.t}/${o.id}'">${forma(o.t,o.x,o.y,7,null,"#0D1117",2)}
      <text x="${o.x}" y="${o.y+20}" text-anchor="middle">${esc(lab)}</text></g>`; });
  const cl = centro.lab.length>30?centro.lab.slice(0,29)+"…":centro.lab;
  s += `${forma(centro.t,cx,cy,14,null,"#fff",2)}
        <text x="${cx}" y="${cy+30}" text-anchor="middle" style="fill:#F6F7F9;font-weight:600">${esc(cl)}</text>`;
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}

function sequenza(cat, cur){
  const t = cat.find(a=>a.trattativa_id); const intest = t ? `Trattativa ${L("trattativa",t.trattativa_id,t.trattativa)}` :
    (cat[0].prodotto ? `${L("azienda",cat[0].azienda_id,cat[0].azienda)} · ${L("prodotto",cat[0].prodotto_id,cat[0].prodotto)}` : "Sequenza");
  return `<div class="seq"><div class="t">${intest} · ${cat.length} passi</div><div class="steps">
    ${cat.map((a,i)=>`${i?'<div class="arrow">→</div>':''}<a class="step ${a.id===cur?'cur':''} ${a.stato==='da fare'?'da-fare':''}" href="#/o/attivita/${a.id}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="std">${esc(a.codice_standard||"STD-?")}</span>${stato(a)}</div>
      <div class="x">${esc(a.standard||a.descrizione)}</div>
      <div class="dim" style="font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.descrizione)}</div>
      <div class="d"><span>${cod("attivita",a.id)}</span><span>${dt(a.scadenza,false)}</span></div></a>`).join("")}
  </div></div>`;
}

function lista(t, arr, meta){
  if(!arr || !arr.length) return '<div class="empty">Nessun collegamento.</div>';
  return `<div class="list">${arr.map(o=>`<a href="#/o/${t}/${o.id}"><span class="o o-${t}">${esc(o.nome||o.titolo)}</span>
    <span class="meta">${esc(meta(o))}</span></a>`).join("")}</div>`;
}

  sidebar(); $("#crumb").textContent = `CERCA / "${q}"`; $("#q").value = q;
  const r = await api(`/api/cerca?q=${encodeURIComponent(q)}`);
  const sem = r.semantica.map(s=>{ const t = s.tipo==="nota"?null:(s.tipo==="trattativa"?"trattativa":"attivita");
    return `<a href="${t?`#/o/${t}/${s.id}`:'#'}" ${t?'':'onclick="return false"'}><span>${t?`<span class="o o-${t}">${esc(s.tipo)}</span>`:'<span class="dim">nota</span>'} ${esc(s.testo)}
      <div class="dim" style="font-size:11px">${esc(s.azienda||"")}</div></span><span class="meta">${s.somiglianza}</span></a>`}).join("");
  $("#main").innerHTML = `<div class="cols3" style="margin-top:0">
    <div><div class="panel" style="margin-bottom:14px"><div class="ph">Centri<span class="n">${r.aziende.length}</span></div>${lista("azienda",r.aziende,x=>x.tipo||"")}</div>
      <div class="panel" style="margin-bottom:14px"><div class="ph">Persone<span class="n">${r.contatti.length}</span></div>${lista("contatto",r.contatti.map(c=>({...c,nome:`${c.nome} ${c.cognome||""}`})),x=>x.azienda||"")}</div>
      <div class="panel"><div class="ph">Prodotti<span class="n">${r.prodotti.length}</span></div>${lista("prodotto",r.prodotti,x=>x.divisione)}</div></div>
    <div class="panel"><div class="ph">Per significato · note, attività, trattative</div>${sem?`<div class="list">${sem}</div>`:'<div class="empty">Nessun risultato.</div>'}</div></div>`;
}

/* ---------- nuova attività ---------- */
const opt = (arr, lab, sel) => `<option value="">—</option>` + arr.map(o=>`<option value="${o.id??o.codice}" ${String(o.id??o.codice)===String(sel)?'selected':''}>${esc(lab(o))}</option>`).join("");
let PRE = {};
function apriNuova(pre={}){
  PRE = pre; const m = META;
  $("#fStd").innerHTML = opt(m.standard, s=>`${s.codice} · ${s.nome}`, pre.codice_standard);
  $("#fAz").innerHTML = opt(m.aziende, a=>a.nome, pre.azienda_id);
  const ctAz = () => { const az = $("#fAz").value; $("#fCt").innerHTML = opt(m.contatti.filter(c=>!az||String(c.azienda_id)===az), c=>c.nome, PRE.contatto_id);
    $("#fTr").innerHTML = opt(m.trattative.filter(t=>!az||!t.azienda_id||String(t.azienda_id)===az), t=>`[${NOMEGEN(t.genere)}] ${t.titolo}`, PRE.trattativa_id); };
  $("#fAz").onchange = ctAz; ctAz();
  $("#fWarn").innerHTML = ""; $("#fCt").onchange = controllaGia; $("#fTr").onchange = controllaGia; if(PRE.contatto_id) controllaGia();
  $("#fPr").innerHTML = opt(m.prodotti, p=>`${p.nome} (${p.divisione})`, pre.prodotto_id);
  $("#fDesc").value = ""; $("#fScad").value = ""; $("#fErr").textContent = "";
  $("#mPrec").textContent = pre.precedente_id ? `dopo ${cod("attivita",pre.precedente_id)}` : "sequenza automatica";
  $("#modal").classList.add("on"); $("#fDesc").focus();
}
function chiudiNuova(){ $("#modal").classList.remove("on"); }
async function controllaGia(){
  const c = Number($("#fCt").value); const t = Number($("#fTr").value)||""; if(!c){ $("#fWarn").innerHTML=""; return; }
  const r = await api(`/api/contatto/${c}/storico${t?`?trattativa=${t}`:""}`);
  $("#fWarn").innerHTML = r.avvisi.length ? `<div class="warn"><b>⚠ Attenzione:</b> ${r.avvisi.map(esc).join(" ")}</div>` : ""; }
async function salvaNuova(){
  const v = id => $(id).value || null; const n = id => v(id) ? Number(v(id)) : null;
  const body = {descrizione:($("#fDesc").value||"").trim(), codice_standard:v("#fStd"), tipo:v("#fTipo"), priorita:v("#fPri"),
    scadenza:v("#fScad"), azienda_id:n("#fAz"), contatto_id:n("#fCt"), prodotto_id:n("#fPr"), trattativa_id:n("#fTr"),
    precedente_id: PRE.precedente_id ?? null};
  if(!body.descrizione){ $("#fErr").textContent = "Scrivi una descrizione."; return; }
  if(!body.codice_standard){ $("#fErr").textContent = "Scegli l'attività standard."; return; }
  try{ const r = await api("/api/attivita",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    chiudiNuova(); META = await api("/api/meta"); toast(r.attenzione ? `Creata ${cod("attivita",r.id)} — ⚠ ${r.attenzione[0]}` : `Creata ${cod("attivita",r.id)}`); location.hash = `/o/attivita/${r.id}`;
  }catch(e){ $("#fErr").textContent = e.message; }
}

function righeAtt(arr){
  if(!arr.length) return '<div class="empty">Nessuna.</div>';
  return `<div class="list">${arr.map(a=>`<a href="#/o/attivita/${a.id}"><span><span class="std">${esc(a.codice_standard||"STD-?")}</span> ${esc(a.descrizione)}
    <div class="dim" style="font-size:11px">${esc([a.standard,a.contatto,a.prodotto].filter(Boolean).join(" · "))}${a.esito?` — ${esc(a.esito)}`:''}</div></span>
    <span class="meta">${dt(a.scadenza||a.completata_il,false)} ${stato(a)}</span></a>`).join("")}</div>`;
}

/* ---------- situazione del centro: operazioni, vendite, con chi ---------- */
function pannelloSituazione(ops){
  const inCorso = ops.filter(o=>o.stato==="in corso"||o.stato==="ferma"||o.stato==="sospeso");
  const vend = ops.filter(o=>o.stato==="venduto");
  const perse = ops.filter(o=>o.stato==="rifiutato"||o.stato==="scelto altro");
  const tot = vend.reduce((s,o)=>s+(+o.valore_eur||0),0);
  const statoTxt = o => o.stato==="scelto altro" ? `scelto altro${o.concorrente?": "+esc(o.concorrente):""}` : esc(o.stato);
  const card = o => `<div class="op op-${o.stato.replace(' ','-')}">
      <div class="op-h"><span>${o.trattativa_id?L("trattativa",o.trattativa_id,o.titolo):esc(o.titolo)}</span><span class="op-st">${statoTxt(o)}</span></div>
      <div class="op-r"><span class="k">Prodotto</span>${o.prodotto_id?L("prodotto",o.prodotto_id,o.prodotto):'<span class="dim">—</span>'}${o.valore_eur?` <span class="dim">· ${eur(o.valore_eur)}</span>`:''}${o.data_esito?` <span class="dim">· ${dt(o.data_esito,false)}</span>`:''}</div>
      <div class="op-r"><span class="k">Gestita con</span>${o.persone.length?o.persone.map(p=>`${L("contatto",p.id,p.nome)}${p.conosciuto?' <span class="know">★</span>':''}${p.ruolo?` <span class="dim">(${esc(p.ruolo)})</span>`:''}`).join(", "):'<span class="dim">nessuna persona indicata</span>'}</div>
      <div class="op-r"><span class="k">Attività</span>${o.n_fatte} concluse · ${o.n_aperte} in corso</div>
      ${o.ultima?`<div class="op-r"><span class="k">Ultima</span><a href="#/o/attivita/${o.ultima.id}">${esc(o.ultima.standard||o.ultima.descrizione||"attività")}</a> <span class="dim">${dt(o.ultima.completata_il,false)}${o.ultima.contatto?" · "+esc(o.ultima.contatto):""}</span></div>`:''}
      ${o.prossima?`<div class="op-r"><span class="k">Prossima</span><a href="#/o/attivita/${o.prossima.id}">${esc(o.prossima.standard||o.prossima.descrizione||"attività")}</a> <span class="dim">${o.prossima.scadenza?dt(o.prossima.scadenza,false):"senza data"}${o.prossima.contatto?" · "+esc(o.prossima.contatto):""}</span></div>`:''}
    </div>`;
  const col = (tit, arr, vuoto, extra="") => `<div class="op-col"><div class="op-t">${tit} <span class="n">${arr.length}${extra}</span></div>${arr.length?arr.map(card).join(""):`<div class="empty">${vuoto}</div>`}</div>`;
  return `<div class="panel" style="margin-top:14px"><div class="ph">Situazione del centro<span class="n">${ops.length} operazioni</span></div>
    <div class="op-grid">${col("In corso",inCorso,"Nessuna operazione aperta.")}${col("Venduto",vend,"Ancora nessuna vendita.",tot?` · ${eur(tot)}`:"")}${col("Chiuse senza vendita",perse,"—")}</div></div>`;
}

  <div class="panel"><div class="ph">Attività da fare<span class="n">${d.da_fare.length}</span></div>${righeAtt(d.da_fare)}</div>
  <div class="panel"><div class="ph">Attività fatte<span class="n">${d.fatte.length}</span></div>${righeAtt(d.fatte)}</div></div>`;

/* ---------- mappa ---------- */
let MAPPA = null;
async function caricaMappa(){ if(!MAPPA) MAPPA = await api("mappa.json"); return MAPPA; }
function svgMappa(m, conteggi, regione, provincia, onReg, onProv){
  const rc = Object.fromEntries(conteggi.per_regione.map(r=>[r.chiave,r.n]));
  const pc = Object.fromEntries(conteggi.per_provincia.map(r=>[r.chiave,r.n]));
  const fill = (n,max) => n ? `rgba(76,144,240,${(0.22+0.7*n/max).toFixed(2)})` : "#1C2127";
  let g = "";
  if(!regione){
    const max = Math.max(1,...Object.values(rc));
    g = m.regioni.map(r=>`<path d="${r.d}" fill="${fill(rc[r.nome],max)}" data-r="${esc(r.nome)}"><title>${esc(r.nome)}: ${rc[r.nome]||0} centri</title></path>`).join("");
  } else {
    const prov = m.province.filter(p=>p.regione===regione); const max = Math.max(1,...prov.map(p=>pc[p.sigla]||0));
    g = m.regioni.filter(r=>r.nome!==regione).map(r=>`<path class="dim" d="${r.d}" fill="#18202B" data-r="${esc(r.nome)}"><title>${esc(r.nome)}</title></path>`).join("")
      + `<g id="provG">${prov.map(p=>`<path class="${provincia===p.sigla?'sel':''}" d="${p.d}" fill="${provincia===p.sigla?'#2D72D2':fill(pc[p.sigla],max)}" data-p="${p.sigla}"><title>${esc(p.nome)} (${p.sigla}): ${pc[p.sigla]||0} centri</title></path>`).join("")}</g><g id="provL"></g>`;
  }
  return `<svg class="map" id="mappa" viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function attivaMappa(m, regione, conteggi, onReg, onProv){
  const svg = $("#mappa"); if(!svg) return;
  svg.querySelectorAll("path[data-r]").forEach(el=>el.onclick=()=>onReg(el.dataset.r));
  svg.querySelectorAll("path[data-p]").forEach(el=>el.onclick=()=>onProv(el.dataset.p));
  if(regione){ const g = $("#provG"); if(!g) return; const b = g.getBBox(); const pad = Math.max(b.width,b.height)*0.08;
    svg.setAttribute("viewBox", `${b.x-pad} ${b.y-pad} ${b.width+2*pad} ${b.height+2*pad}`);
    const pc = Object.fromEntries(conteggi.per_provincia.map(r=>[r.chiave,r.n])); const k = Math.max(b.width,b.height)/300;
    $("#provL").innerHTML = [...g.querySelectorAll("path")].map(p=>{ const bb=p.getBBox(); const n=pc[p.dataset.p];
      return `<text x="${bb.x+bb.width/2}" y="${bb.y+bb.height/2}" style="font-size:${(9*k).toFixed(2)}px">${p.dataset.p}${n?` ${n}`:''}</text>`; }).join("");
  }
}

/* ---------- filtri luogo condivisi ---------- */
function selettoriLuogo(view, q, conCentro=true){
  const R = (q.regione||"").split(",").filter(Boolean), P = (q.provincia||"").split(",").filter(Boolean);
  const provDi = r => META.province.filter(p=>p.regione===r).map(p=>p.sigla);
  const piene = R.filter(r=>!provDi(r).some(x=>P.includes(x)));
  const centri = META.aziende.filter(a=>(!R.length&&!P.length) || P.includes(a.provincia) || piene.includes(a.regione));
  return conCentro ? `<select class="f" onchange='vaiQ("${view}",${esc(JSON.stringify(q))},{centro:this.value})'><option value="">Tutti i centri${(q.provincia||q.regione)?" dell'area scelta":""}</option>${centri.map(a=>`<option value="${a.id}" ${String(q.centro)===String(a.id)?'selected':''}>${esc(a.nome)}</option>`).join("")}</select>` : "";
}
/* filtro per regione e provincia su mappa */
function mappaFiltro(view, q){
  const L = x => (x||"").split(",").filter(Boolean);
  const ini = {regioni:L(q.regione), province:L(q.provincia)};
  setTimeout(()=>{ if(SEL["fm_"+view]) SEL["fm_"+view].onchange = st => vaiQ(view, q, {regione:[...st.regioni].join(","), provincia:[...st.province].join(","), centro:""}); }, 0);
  const tot = ini.regioni.length + ini.province.length;
  return `<div class="panel fm"><div class="ph">Area geografica${tot?`<button class="ghost dx" style="font-size:11px;padding:2px 8px" onclick='vaiQ("${view}",${esc(JSON.stringify(q))},{regione:"",provincia:"",centro:""})'>Azzera</button>`:'<span class="n">tutta Italia</span>'}</div>
    <div style="padding:10px 12px" class="selvert">${selettoreMappa("fm_"+view, ini)}</div></div>`;
}

/* ---------- tabelle ordinabili e modificabili ---------- */
const TIPI_CENTRO = ["ospedale pubblico","ospedale privato","clinica privata","centro medico","RSA","gruppo sanitario","laboratorio","università","distributore","partner","fornitore","altro"];
const SORT = {}; const TABDATA = {};
function tabellaEd(id, rows, cols, tab){
  TABDATA[id] = {rows, cols, tab};
  const st = SORT[id];
  if(st){ const c = cols.find(c=>c.k===st.k); const val = r => c.sortv ? c.sortv(r) : r[st.k];
    rows.sort((a,b)=>{ const x=val(a), y=val(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
      return (typeof x==="number"&&typeof y==="number" ? x-y : String(x).localeCompare(String(y),"it",{numeric:true})) * st.dir; }); }
  return `<table class="tab" id="${id}"><thead><tr>${cols.map(c=>`<th ${c.w?`style="width:${c.w}"`:''} onclick="ordina('${id}','${c.k}')">${c.lab}${st&&st.k===c.k?(st.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>
    ${rows.map((r,i)=>`<tr>${cols.map(c=>`<td class="${c.edit?'ed':''}" ${c.edit?`onclick="modificaCella('${id}',${i},'${c.k}',this)"`:''}>${c.render?c.render(r):esc(r[c.k]??"")}</td>`).join("")}</tr>`).join("")}
  </tbody></table>`;
}
function ordina(id, k){ const st = SORT[id]; SORT[id] = {k, dir: st&&st.k===k ? -st.dir : 1}; const t = TABDATA[id]; $("#"+id).outerHTML = tabellaEd(id, t.rows, t.cols, t.tab); }
function modificaCella(id, i, k, td){
  if(td.querySelector("input,select")) return;
  const t = TABDATA[id], r = t.rows[i], c = t.cols.find(c=>c.k===k);
  const v = r[c.campo||k] ?? "";
  td.innerHTML = c.edit==="select" ? `<select>${["",...c.opts].map(o=>`<option ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join("")}</select>` : `<input value="${esc(v)}">`;
  const el = td.firstChild; el.focus(); let fatto = false;
  const salva = async () => { if(fatto) return; fatto = true; const nv = el.value;
    if(String(nv)!==String(v)){ try{ await post(`/api/modifica/${t.tab}/${r.id}`, {[c.campo||k]: nv}); r[c.campo||k] = nv||null; toast("Salvato"); }catch(e){ toast(e.message); } }
    td.innerHTML = c.render ? c.render(r) : esc(r[k]??""); };
  el.onblur = salva; el.onkeydown = e => { if(e.key==="Enter") el.blur(); if(e.key==="Escape"){ fatto=true; td.innerHTML = c.render?c.render(r):esc(r[k]??""); } };
  if(c.edit==="select") el.onchange = () => el.blur();
}
function esportaCSV(id, nome){
  const t = TABDATA[id]; const cols = t.cols.filter(c=>c.csv!==false);
  const cella = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const testo = [cols.map(c=>cella(c.lab)).join(";"), ...t.rows.map(r=>cols.map(c=>cella(c.csvv?c.csvv(r):r[c.campo||c.k])).join(";"))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿"+testo],{type:"text/csv"})); a.download = nome+".csv"; a.click();
}

const MCOL = {radice:"#F6F7F9", obiettivo:COL.obiettivo, trattativa:COL.trattativa, azienda:COL.azienda, contatto:COL.contatto, prodotto:COL.prodotto, attivita:COL.attivita};
let MM_ZOOM = 1;
function nodoMM(n, x, y, liv){
  const col = n.esito ? ESCOL[n.esito] : (MCOL[n.tipo]||"#ABB3BF");
  const w = liv===0 ? 300 : liv===1 ? 236 : 206, h = liv===0 ? 64 : liv===1 ? 50 : 44;
  const lab = tronca(n.label, liv===0?32:liv===1?25:21), sub = n.sub ? tronca(n.sub, liv===0?38:28) : "";
  const href = n.tipo==="radice" ? "#/mappa" : `#/mappa?tipo=${n.tipo}&id=${n.id}`;
  return `<a href="${href}"><g class="mmn"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#18202B" stroke="${col}" stroke-width="${liv===0?2.5:1.5}" ${n.stato==="da fare"&&!n.esito?'stroke-dasharray="5 4"':''}/>
    ${n.tipo!=="radice"?forma(n.tipo, x-w/2+h/2, y, liv===0?9:7, MCOL[n.tipo], "#0D1117", 1.5):""}
    <text x="${x+(n.tipo!=="radice"?11:0)}" y="${y+(sub?-4:5)}" text-anchor="middle" style="font-size:${liv===0?17:liv===1?14:13}px;font-weight:${liv<2?600:400}">${n.conosciuto?"★ ":""}${esc(lab)}</text>
    ${sub?`<text x="${x+(n.tipo!=="radice"?11:0)}" y="${y+(liv===0?16:14)}" text-anchor="middle" class="t2">${esc(sub)}</text>`:''}</g></a>`;
}
const MMW = liv => liv===0 ? [300,64] : liv===1 ? [236,50] : [206,44];
function ramoMM(id, x1, y1, x2, y2, col, w, label, l1, l2){
  const sx = x2 >= x1; const [ax,ay,bx,by] = sx ? [x1,y1,x2,y2] : [x2,y2,x1,y1];
  const [wa,ha] = MMW(sx?l1:l2), [wb,hb] = MMW(sx?l2:l1);
  const L = Math.hypot(bx-ax, by-ay) || 1, cs = Math.abs(bx-ax)/L, sn = Math.abs(by-ay)/L;
  const ca = Math.min(wa/2/Math.max(cs,.01), ha/2/Math.max(sn,.01)), cb = Math.min(wb/2/Math.max(cs,.01), hb/2/Math.max(sn,.01));
  const libero = Math.max(0, L - ca - cb), centro = (ca + libero/2) / L * 100;
  const n = Math.floor(libero / 7.2);
  const mx = (ax+bx)/2, my = (ay+by)/2 - Math.abs(bx-ax)*0.06;
  const d = `M${ax},${ay} Q${mx},${my} ${bx},${by}`;
  return `<path id="${id}" d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-opacity=".75" stroke-linecap="round"><title>${esc(label)}</title></path>
    ${n>=4?`<text dy="-7" class="ramo"><textPath href="#${id}" startOffset="${centro.toFixed(1)}%" text-anchor="middle">${esc(tronca(label,n))}<title>${esc(label)}</title></textPath></text>`:''}`;
}
function disegnaMappa(m){
  const rami = m.rami; const foglie = rami.map(r=>Math.max(1,(r.figli||[]).length));
  const totale = foglie.reduce((a,b)=>a+b,0) || 1;
  const R1 = Math.max(270, 40 + rami.length*24), R2 = R1 + Math.max(210, Math.min(330, totale*12));
  const cx = 0, cy = 0; let ang = -Math.PI/2, rr = "", nn = "", k = 0;
  rami.forEach((r,i)=>{
    const quota = 2*Math.PI*foglie[i]/totale, a1 = ang + quota/2;
    const x1 = cx + R1*Math.cos(a1)*1.4, y1 = cy + R1*Math.sin(a1);
    const col = r.nodo.esito ? ESCOL[r.nodo.esito] : MCOL[r.nodo.tipo]||"#ABB3BF";
    rr += ramoMM(`r${k++}`, cx, cy, x1, y1, col, 3, r.label, 0, 1);
    (r.figli||[]).forEach((f,j)=>{
      const a2 = ang + quota*(j+0.5)/foglie[i]; const x2 = cx + R2*Math.cos(a2)*1.4, y2 = cy + R2*Math.sin(a2);
      const c2 = f.nodo.esito ? ESCOL[f.nodo.esito] : MCOL[f.nodo.tipo]||"#ABB3BF";
      rr += ramoMM(`r${k++}`, x1, y1, x2, y2, c2, 1.5, f.label, 1, 2);
      nn += nodoMM(f.nodo, x2, y2, 2);
    });
    nn += nodoMM(r.nodo, x1, y1, 1);
    ang += quota;
  });
  nn += nodoMM(m.centro, cx, cy, 0);
  const W = (R2*1.4+120)*2, H = (R2+50)*2;
  return {svg: rr + nn, vb: [-W/2, -H/2, W, H]};
}
