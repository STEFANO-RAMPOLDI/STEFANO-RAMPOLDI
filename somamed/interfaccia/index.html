/* ---------- grafo a corsie ---------- */
const ESITO = {vendita:["e-vendita","✓ vendita"],rifiuto:["e-rifiuto","✕ rifiuto"],"scelto altro":["e-scelto","↪ scelto altro"],sospesa:["e-sospesa","⏸ sospesa"]};
const ESCOL = {vendita:"#3DB37A",rifiuto:"#E5636A","scelto altro":"#E5636A",sospesa:"#E1B84E"};
const esitoTag = e => e ? `<span class="esito ${ESITO[e.esito][0]}">${ESITO[e.esito][1]}${e.concorrente?`: ${esc(e.concorrente)}`:''}</span>` : '<span class="esito e-aperto">in corso</span>';
const tronca = (t,n) => { t = String(t||""); return t.length>n ? t.slice(0,n-1)+"…" : t; };
const INFO = {}; let INFO_N = 0;
function info(obj){ const k = "i"+(INFO_N++); INFO[k] = obj; return k; }
function grafoCorsie(gruppi){
  const RH=62, W={o:220,c:250,a:210,s:170,e:140,p:44}, G=34, NEUTRO="#4A5668";
  const xO=12, xC=xO+W.o+G, xA=xC+W.c+G, xS0=xA+W.a+G;
  let y=14, maxX=xS0+W.e, nodi="", archi="";
  const curva=(x1,y1,x2,y2)=>`<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}" fill="none" stroke="${NEUTRO}" stroke-width="1.2"/>`;
  const box=(href,x,yy,w,h,l1,l2,l3,k,t)=>`<a href="${href}" data-info="${k}"><rect x="${x}" y="${yy}" width="${w}" height="${h}" rx="4" fill="#18202B" stroke="${t?COL[t]:NEUTRO}" stroke-opacity="${t?.55:1}"/>
    ${t?`<rect x="${x}" y="${yy}" width="4" height="${h}" rx="2" fill="${COL[t]}"/>${forma(t, x+16, yy+15, 5, null, "#18202B", 1)}`:''}
    <text x="${x+27}" y="${yy+19}">${esc(l1)}</text>${l2?`<text x="${x+27}" y="${yy+34}" class="t2">${esc(l2)}</text>`:''}
    ${l3?`<text x="${x+w-8}" y="${yy+h-7}" class="t3" text-anchor="end">${esc(l3)}</text>`:''}</a>`;
  for(const g of gruppi){
    const yO0 = y; const posC = [];
    for(const c of g.contenitori){
      const yC0 = y; const righe = c.corsie.length ? c.corsie : [null];
      const posA = [];
      for(const r of righe){
        const yy = y;
        if(r){
          posA.push(yy+25);
          nodi += box(r.azienda_id?`#/o/azienda/${r.azienda_id}`:"#", xA, yy, W.a, 50, tronca(r.azienda,30), r.provincia||"", "",
            info({Centro:r.azienda, Provincia:r.provincia, Attività:r.attivita.length, Esito:r.esito?(ESITO[r.esito.esito][1]+(r.esito.concorrente?": "+r.esito.concorrente:"")):"in corso"}), "azienda");
          let px = xA+W.a, py = yy+25, ultima = null;
          r.attivita.forEach((a,i)=>{ const x = xS0 + i*(W.s+14);
            archi += curva(px,py,x,yy+25);
            nodi += box(`#/o/attivita/${a.id}`, x, yy, W.s, 50, tronca(a.standard||a.descrizione,24), tronca(a.contatto||"",26),
              a.stato==="fatta"?"conclusa":"in corso",
              info({Attività:`${a.codice_standard||""} ${a.standard||""}`.trim(), Descrizione:a.descrizione, Persona:a.contatto, Centro:r.azienda,
                    Data:dt(a.scadenza), Stato:a.stato==="fatta"?"conclusa":(a.scaduta?"in corso — scaduta":"in corso"), Esito:a.esito}), "attivita");
            px = x+W.s; ultima = a; });
          // pulsante + per aggiungere un'attività in fondo alla riga
          const xp = xS0 + r.attivita.length*(W.s+14);
          archi += curva(px,py,xp,yy+25);
          const pre = {trattativa_id:c.id, azienda_id:r.azienda_id||null, precedente_id:ultima?ultima.id:null, titolo:c.titolo, azienda:r.azienda,
                       ordine:ultima?ultima.codice_standard:null};
          nodi += `<g class="piu" onclick='formAttivitaPagina(${esc(JSON.stringify(pre))})' data-info="${info({Aggiungi:"una nuova attività per "+r.azienda, Iniziativa:c.titolo})}">
            <rect x="${xp}" y="${yy+5}" width="${W.p}" height="40" rx="3" fill="#18202B" stroke="${NEUTRO}" stroke-dasharray="3 3"/>
            <text x="${xp+W.p/2}" y="${yy+31}" text-anchor="middle" style="font-size:20px;fill:#ABB3BF">＋</text></g>`;
          const xe = xp + W.p + 14; const e = r.esito;
          const ce = e?ESCOL[e.esito]:SEM.corso;
          nodi += `<g data-info="${info({Esito:e?(ESITO[e.esito][1]+(e.concorrente?": "+e.concorrente:"")):"in corso", Nota:e&&e.note})}"><rect x="${xe}" y="${yy+5}" width="${W.e}" height="40" rx="20" fill="${ce}" fill-opacity="${e?.16:.06}" stroke="${ce}" ${e?'':'stroke-dasharray="4 3"'}/>
            <text x="${xe+W.e/2}" y="${yy+29}" text-anchor="middle" style="fill:${ce};font-weight:600">${e?esc(tronca(({vendita:"venduto",rifiuto:"rifiutato","scelto altro":"scelto altro",sospesa:"sospeso"})[e.esito]+(e.concorrente?": "+e.concorrente:""),20)):"in corso"}</text></g>`;
          maxX = Math.max(maxX, xe+W.e+12);
        }
        y += RH;
      }
      const cy = yC0 + ((y-yC0)-RH)/2;
      posA.forEach(ya=>archi += curva(xC+W.c, cy+25, xA, ya));
      const tot = c.corsie.length; const v = c.corsie.filter(r=>r.esito&&r.esito.esito==="vendita").length;
      nodi += box(`#/o/trattativa/${c.id}`, xC, cy, W.c, 50, tronca(c.titolo,34), `${NOMEGEN(c.genere)} · ${tot} centri`, "",
        info({Iniziativa:c.titolo, Tipo:NOMEGEN(c.genere), Prodotto:c.prodotto, Centri:tot, Vendite:v, Valore:c.valore_eur?eur(c.valore_eur):null}), "trattativa");
      posC.push(cy+25);
      y += 8;
    }
    const oy = yO0 + ((y-yO0)-RH)/2;
    if(g.obiettivo){ posC.forEach(yc=>archi += curva(xO+W.o, oy+25, xC, yc));

        info({Obiettivo:g.obiettivo.titolo, Entro:dt(g.obiettivo.scadenza,false), Budget:g.obiettivo.valore_eur?eur(g.obiettivo.valore_eur):null, Descrizione:g.obiettivo.descrizione}), "obiettivo");

function mostraInfo(e){

/* ---------- mappa esiti ---------- */
function mappaEsiti(m, provCentri, esiti, corsie){
  const stato = {}; const peso = {vendita:4,"in corso":3,"scelto altro":2,rifiuto:1,sospesa:0};
  const esAz = Object.fromEntries(esiti.map(e=>[e.azienda_id,e.esito]));
  provCentri.forEach(pc=>{ const st = esAz[pc.azienda_id] || "in corso"; const cur = stato[pc.provincia];
    if(cur==null || peso[st]>peso[cur]) stato[pc.provincia] = st; });
  if(!Object.keys(stato).length) return '<div class="empty">I centri di questa iniziativa non hanno ancora una provincia.</div>';
  const col = st => st==="in corso" ? "rgba(76,144,240,.55)" : ESCOL[st]+"cc";
  const paths = m.province.map(p=>`<path d="${p.d}" data-s="${stato[p.sigla]?1:0}" fill="${stato[p.sigla]?col(stato[p.sigla]):"#1C2127"}" ${stato[p.sigla]?'':'class="dim"'}><title>${esc(p.nome)}${stato[p.sigla]?": "+stato[p.sigla]:""}</title></path>`).join("");
  return `<svg class="map" id="mappaE" style="height:380px" viewBox="0 0 ${m.w} ${m.h}">${paths}</svg>`;
}
function adattaMappaE(){ const svg=$("#mappaE"); if(!svg) return; const ps=[...svg.querySelectorAll('path[data-s="1"]')]; if(!ps.length) return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; ps.forEach(p=>{const b=p.getBBox(); x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.width);y2=Math.max(y2,b.y+b.height);});
  const pad=Math.max(x2-x1,y2-y1)*0.35+20; svg.setAttribute("viewBox",`${x1-pad} ${y1-pad} ${x2-x1+2*pad} ${y2-y1+2*pad}`); }

/* ---------- ASSISTENTE OBIETTIVI: domande → piano misurabile (stesse formule di crm/pianifica.py) ---------- */
const PREDEF_PIANO = {conv_contatto:30, conv_offerta:50, conv_ordine:35, ciclo_mesi:6, ore_vinto:30, ore_contatto:1.5, persone:1,
  ore_settimana:10, costo_orario:50, provvigione:0, marketing:0, costo_presentazione:150, margine:40};
const nn = (v,d=0) => (v===null||v===undefined||v==="") ? d : (isNaN(Number(v)) ? d : Number(v));
function calcolaPiano(r){
  const R = {...PREDEF_PIANO}; Object.entries(r||{}).forEach(([k,v])=>{ if(v!==null&&v!==undefined&&v!=="") R[k]=v; });
  const ricavo = nn(R.ricavo), valore = nn(R.valore_medio);
  const c1 = Math.max(.01, nn(R.conv_contatto)/100), c2 = Math.max(.01, nn(R.conv_offerta)/100), c3 = Math.max(.01, nn(R.conv_ordine)/100);
  const vendite = Math.max(ricavo&&valore ? Math.ceil(ricavo/valore) : 0, Math.trunc(nn(R.centri_obiettivo)));
  const offerte = Math.ceil(vendite/c3), presentazioni = Math.ceil(offerte/c2), contatti = Math.ceil(presentazioni/c1);
  const ricavoAtteso = ricavo ? ricavo : vendite*valore;
  let mesi = null; if(R.scadenza){ const f = new Date(String(R.scadenza).slice(0,10)+"T00:00"), o = new Date(); o.setHours(0,0,0,0);
    if(!isNaN(f)) mesi = Math.max(0, Math.round((f-o)/864e5)/30.44); }
  const ciclo = nn(R.ciclo_mesi,6), mesiC = mesi!==null ? Math.max(0, mesi-ciclo) : null;
  const settimane = Math.max(1, (mesiC ? mesiC : (mesi||12))*4.33);
  const ov = nn(R.ore_vinto,30), oc = nn(R.ore_contatto,1.5);
  const ore = vendite*ov + (presentazioni-vendite)*ov*.4 + (contatti-presentazioni)*oc;
  const oreDisp = nn(R.persone,1)*nn(R.ore_settimana,10)*(mesi||12)*4.33;
  const personale = ore*nn(R.costo_orario,50), provv = ricavoAtteso*nn(R.provvigione)/100, mkt = nn(R.marketing), pres = presentazioni*nn(R.costo_presentazione,150);
  const costi = personale+provv+mkt+pres, margine = ricavoAtteso*nn(R.margine,40)/100, risultato = margine-costi;
  const unit = valore ? valore*nn(R.margine,40)/100 : 0, disp = Math.trunc(nn(R.centri_disponibili));
  const mm = Math.max(1, mesi||12), av = [];
  if(!vendite) av.push(["no","Manca la misura: indica il fatturato con il valore medio di una vendita, oppure il numero di centri."]);
  if(disp && contatti>disp) av.push(["no",`Servono ${contatti} centri da contattare ma nell'area ce ne sono ${disp}: allarga l'area o i tipi di centro, oppure migliora le percentuali di conversione.`]);
  else if(disp && contatti>disp*.6) av.push(["att",`Devi contattare ${Math.round(contatti/disp*100)}% dei centri dell'area: margine di errore piccolo.`]);
  if(mesi!==null && mesiC<=0) av.push(["no",`La vendita dura circa ${ciclo} mesi ma alla scadenza ne mancano ${mesi.toFixed(1)}: i nuovi contatti non chiuderanno in tempo.`]);
  else if(mesiC!==null && mesiC<2) av.push(["att",`Restano solo ${mesiC.toFixed(1)} mesi per fare i primi contatti: vanno concentrati subito.`]);
  if(oreDisp && ore>oreDisp) av.push(["no",`Servono circa ${Math.round(ore)} ore di lavoro ma ne avete ${Math.round(oreDisp)}: mancano ${Math.round(ore-oreDisp)} ore, circa ${Math.ceil((ore-oreDisp)/Math.max(1,(mesi||12)*4.33))} ore a settimana in più.`]);
  else if(oreDisp && ore>oreDisp*.8) av.push(["att","Le ore disponibili bastano appena: nessun margine per imprevisti."]);

         {misura:"Presentazioni / demo", valore:presentazioni, ritmo:`${(presentazioni/mm).toFixed(1)} al mese`},
         {misura:"Offerte", valore:offerte, ritmo:`${(offerte/mm).toFixed(1)} al mese`},
         {misura:"Ordini", valore:vendite, ritmo:R.scadenza?`entro ${dt(R.scadenza,false)}`:""},
         {misura:"Offerte aperte da tenere in gioco (€)", valore:valore?Math.round(offerte*valore):null, ritmo:"pipeline necessaria"}],
    avvisi:av.map(([tipo,testo])=>({tipo,testo}))};
}

/* ---------- zoom e trascinamento delle mappe ---------- */
function abilitaZoom(svg, pulsanti=true){
  if(!svg || svg._zoom) return;
  const base = svg.getAttribute("viewBox").split(/[\s,]+/).map(Number); let vb = base.slice();
  const set = () => svg.setAttribute("viewBox", vb.map(v=>v.toFixed(2)).join(" "));
  const scala = () => { const r = svg.getBoundingClientRect(); return [r, Math.max(vb[2]/r.width, vb[3]/r.height)]; };
  const punto = e => { const [r,k] = scala(); const ox=(r.width*k-vb[2])/2, oy=(r.height*k-vb[3])/2; return [vb[0]-ox+(e.clientX-r.left)*k, vb[1]-oy+(e.clientY-r.top)*k]; };
  svg.classList.add("zoomabile");
  svg.addEventListener("wheel", e => { e.preventDefault(); const f = e.deltaY>0 ? 1.15 : 1/1.15; const [px,py] = punto(e);
    vb = [px-(px-vb[0])*f, py-(py-vb[1])*f, vb[2]*f, vb[3]*f]; set(); }, {passive:false});
  let tr = null, mosso = false;
  svg.addEventListener("pointerdown", e => { tr = {x:e.clientX, y:e.clientY, vb:vb.slice(), id:e.pointerId}; mosso = false; });
  svg.addEventListener("pointermove", e => { if(!tr) return; const dxp=e.clientX-tr.x, dyp=e.clientY-tr.y;
    if(!mosso && Math.abs(dxp)+Math.abs(dyp) > 5){ mosso = true; try{ svg.setPointerCapture(tr.id); }catch(_){} }
    if(mosso){ const k = Math.max(tr.vb[2]/svg.getBoundingClientRect().width, tr.vb[3]/svg.getBoundingClientRect().height);
      vb = [tr.vb[0]-dxp*k, tr.vb[1]-dyp*k, tr.vb[2], tr.vb[3]]; set(); } });
  const fine = () => { tr = null; };
  svg.addEventListener("pointerup", fine); svg.addEventListener("pointercancel", fine);
  svg.addEventListener("click", e => { if(mosso){ e.preventDefault(); e.stopPropagation(); mosso = false; } }, true);
  svg._zoom = f => { if(f===0) vb = base.slice(); else { const cx=vb[0]+vb[2]/2, cy=vb[1]+vb[3]/2; vb=[cx-vb[2]*f/2, cy-vb[3]*f/2, vb[2]*f, vb[3]*f]; } set(); };
  if(pulsanti){ const w = document.createElement("div"); w.className = "zwrap"; svg.parentNode.insertBefore(w, svg); w.appendChild(svg);
    const b = document.createElement("div"); b.className = "zbtn";
    b.innerHTML = '<button title="Ingrandisci">＋</button><button title="Riduci">－</button><button title="Adatta">⤢</button>';
    const [bp, bm, ba] = b.querySelectorAll("button"); bp.onclick = () => svg._zoom(0.75); bm.onclick = () => svg._zoom(1.33); ba.onclick = () => svg._zoom(0);
    w.appendChild(b); }
}

const SEL = {};
function selettoreMappa(id, iniziale={}, limiti=null){
  SEL[id] = {regioni:new Set(iniziale.regioni||[]), province:new Set(iniziale.province||[]), limiti, onchange:null};
  setTimeout(()=>disegnaSelettore(id), 0);
  return `<div id="${id}"><div class="selmap"><div><div class="dim" style="font-size:11px;margin-bottom:4px">1 · clic sulle regioni</div><div id="${id}R"></div></div>
    <div><div class="dim" style="font-size:11px;margin-bottom:4px">2 · clic sulle province (nessuna = tutta la regione)</div><div id="${id}P"></div></div></div><div class="selsum" id="${id}S"></div></div>`;
}
async function disegnaSelettore(id){
  const m = await caricaMappa(); const st = SEL[id]; if(!st || !document.getElementById(id)) return;
  const L = st.limiti; const regOk = r => !L || !L.regioni || !L.regioni.length || L.regioni.includes(r);
  const provOk = p => !L || !L.province || !L.province.length || L.province.includes(p.sigla);
  $(`#${id}R`).innerHTML = `<svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="xMidYMid meet">${m.regioni.map(r=>`<path d="${r.d}" data-r="${esc(r.nome)}"
     class="${regOk(r.nome)?'':'off'}" fill="${st.regioni.has(r.nome)?'#2D72D2':'#1F2834'}"><title>${esc(r.nome)}</title></path>`).join("")}</svg>`;
  const provs = m.province.filter(p=>st.regioni.has(p.regione));
  $(`#${id}P`).innerHTML = provs.length ? `<svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="xMidYMid meet"><g id="${id}G">${provs.map(p=>`<path d="${p.d}" data-p="${p.sigla}"
     class="${provOk(p)?'':'off'}" fill="${st.province.has(p.sigla)?'#4C90F0':'rgba(76,144,240,.16)'}"><title>${esc(p.nome)} (${p.sigla})</title></path>`).join("")}</g><g id="${id}L"></g></svg>`
     : `<div class="empty" style="height:340px;border:1px solid var(--line)">Scegli prima una o più regioni.</div>`;
  $(`#${id}R svg`).querySelectorAll("path[data-r]").forEach(el => el.onclick = () => { const r = el.dataset.r; if(!regOk(r)) return;
    if(st.regioni.has(r)){ st.regioni.delete(r); m.province.filter(p=>p.regione===r).forEach(p=>st.province.delete(p.sigla)); } else st.regioni.add(r);
    if(st.onchange) return st.onchange(st); disegnaSelettore(id); });
  const sv = $(`#${id}P svg`);
  if(sv){ const g = $(`#${id}G`); const b = g.getBBox(); const pad = Math.max(b.width,b.height)*0.06;
    sv.setAttribute("viewBox", `${b.x-pad} ${b.y-pad} ${b.width+2*pad} ${b.height+2*pad}`);
    const k = Math.max(b.width,b.height)/300;
    $(`#${id}L`).innerHTML = [...g.querySelectorAll("path")].map(pp=>{ const bb=pp.getBBox(); return `<text x="${bb.x+bb.width/2}" y="${bb.y+bb.height/2}" style="font-size:${(8*k).toFixed(2)}px">${pp.dataset.p}</text>`; }).join("");
    sv.querySelectorAll("path[data-p]").forEach(el => el.onclick = () => { const p = el.dataset.p; if(el.classList.contains("off")) return;
      st.province.has(p) ? st.province.delete(p) : st.province.add(p); if(st.onchange) return st.onchange(st); disegnaSelettore(id); });
    abilitaZoom(sv); }
  abilitaZoom($(`#${id}R svg`));
  const regs = [...st.regioni].sort();
  $(`#${id}S`).innerHTML = regs.length ? regs.map(r=>{ const pv = [...st.province].filter(x=>(m.province.find(p=>p.sigla===x)||{}).regione===r).sort();
      return `<b>${esc(r)}</b>: ${pv.length?pv.join(", "):"tutta la regione"}`; }).join(" · ") : '<span class="dim">Nessuna area scelta: vale tutta Italia.</span>';
}
const valoriSel = id => ({regioni:[...(SEL[id]?.regioni||[])], province:[...(SEL[id]?.province||[])]});

  const pct = o.valore_eur ? Math.min(100, Math.round(100*(o.valore_vinto||0)/o.valore_eur)) : null;
  const nFigli = o.sotto.length + o.iniziative.length, chiuso = PIEGHE.has("ob:"+o.id);
  return `<div class="onode ${chiuso?'chiuso':''}" data-ob="${o.id}"><div class="ohd">
      <div class="tit">${nFigli?`<button class="tg" title="Mostra / nascondi" onclick="piegaOb(${o.id})">${chiuso?'▸':'▾'}</button>`:'<span class="tg vuoto"></span>'}<span class="gen ${o.tipo==='budget'?'ob-b':'ob'}">${o.tipo==='budget'?'budget':'area'}</span> ${L("obiettivo",o.id,o.titolo)}
        ${nFigli?`<span class="nasc">${[o.sotto.length?`${o.sotto.length} sotto-obiettiv${o.sotto.length>1?'i':'o'}`:'', o.iniziative.length?`${o.iniziative.length} iniziativ${o.iniziative.length>1?'e':'a'}`:''].filter(Boolean).join(" · ")} nascost${nFigli>1?'i':'o'}</span>`:''}
        <div class="luoghi" style="margin-top:4px">${luoghi(o)}${o.ambito?` <span class="dim" style="font-size:11px">· ${esc(o.ambito)}</span>`:''}${o.scadenza?` <span class="dim mono" style="font-size:11px">· entro ${dt(o.scadenza,false)}</span>`:''}</div></div>
      <div class="num">budget ${eur(o.valore_eur)}${o.n_sotto?`<br><span class="dim">ripartito nei sotto-obiettivi: ${eur(o.budget_sotto)}</span>`:''}<br>vinto ${eur(o.valore_vinto)} · aperto ${eur(o.valore_aperto)}
        ${pct!=null?`<div class="bar" style="height:6px;margin-top:4px"><i style="height:6px;width:${pct}%;background:var(--green)"></i></div>`:''}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="ghost" style="font-size:11px;padding:3px 8px" onclick="nuovoSotto(${o.id})">＋ sotto-obiettivo</button>
        <button class="ghost" style="font-size:11px;padding:3px 8px" onclick="location.hash='/nuova?obiettivo=${o.id}'">＋ iniziativa</button>
        <button class="ghost" style="font-size:11px;padding:3px 8px" onclick="location.hash='/mappa?tipo=obiettivo&id=${o.id}'">✺</button></div></div>
    ${o.iniziative.map(i=>`<div class="oini"><span class="gen ${i.genere}">${NOMEGEN(i.genere)}</span> ${L("trattativa",i.id,i.titolo)}
      <span class="sp"></span><span class="mono dim" style="font-size:11px">${i.n_centri} centri · ${i.n_aperte} aperte · ✓${i.n_vendite}</span>
      ${i.esito?esitoTag({esito:i.esito}):''}
      <button class="ghost" style="font-size:11px;padding:2px 8px" onclick='apriNuova(${esc(JSON.stringify({trattativa_id:i.id}))})'>＋ attività</button></div>`).join("")}
    ${o.sotto.map(nodoObiettivo).join("")}</div>`;
}

  $("#boxFormOb").innerHTML = `<div class="panel" style="margin-top:14px"><div class="ph">${padre?`Nuovo sotto-obiettivo di «${esc(padre.titolo)}»`:"Nuovo obiettivo"}</div>

      <div class="w"><label>Descrizione</label><textarea class="f" id="oD" rows="2"></textarea></div>
      <div class="w"><label>Regioni e province ${padre?"(dentro quelle dell'obiettivo padre)":""}</label>${selettoreMappa("selOb", {}, lim)}</div></div>
    <div class="foot"><button class="ghost" onclick="$('#boxFormOb').innerHTML=''">Annulla</button>
      <button class="primary" style="width:auto;margin:0;padding:6px 16px" onclick="salvaObiettivo(${padreId||'null'})">Crea</button></div></div>`;

async function salvaObiettivo(padreId){ const t = ($("#oT").value||"").trim(); if(!t) return toast("Scrivi l'obiettivo");
  try{ const nuovo = await post("/api/obiettivi",{padre_id:padreId, ...valoriSel("selOb"), tipo:$("#oTi").value, ambito:$("#oA").value||null, titolo:t,
      descrizione:$("#oD").value||null, scadenza:$("#oS").value||null, valore_eur:Number($("#oV").value)||null,
      target_centri:Number($("#oC").value)||null, data_inizio:$("#oI").value||null});

  const sel = valoriSel("selIni"); if(sel.regioni.length) target.regioni=sel.regioni; if(sel.province.length) target.province=sel.province;
  if(lista_csv(v("#tPr")).length) target.professionalita=lista_csv(v("#tPr"));
  const body = {genere:v("#iG"), titolo:($("#iT").value||"").trim(), obiettivo_id:Number(v("#iO"))||null, prodotto_id:Number(v("#iP"))||null,
    azienda_id:Number(v("#iA"))||null, storia:v("#iS"), target, data_inizio:v("#iDi"), data_fine:v("#iDf"), valore_eur:Number(v("#iV"))||null};
  if(!body.titolo){ $("#iErr").textContent="Scrivi il nome."; return; }
  try{ const r = await post("/api/iniziative", body); META = await api("/api/meta"); toast("Creata"); location.hash = `/o/trattativa/${r.id}`; }
  catch(e){ $("#iErr").textContent = e.message; } }

  const gg = s => { if(!s) return "—"; const x=new Date(s); return x.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"}) + (x.getHours()||x.getMinutes()?" "+x.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):""); };
  const riga = a => `<div class="ag ${a.scaduta?'scad':(a.oggi?'oggi':'')}">
      <div class="q">${a.scadenza?gg(a.scadenza):"senza data"}</div>
      <div class="w"><a class="t" href="#/o/attivita/${a.id}">${esc(a.standard||a.tipo||"Attività")}</a>${a.descrizione?` <span class="dim">— ${esc(a.descrizione)}</span>`:''}
        <div class="c">${[a.azienda_id&&L("azienda",a.azienda_id,a.azienda), a.contatto_id&&L("contatto",a.contatto_id,a.contatto), a.trattativa_id&&L("trattativa",a.trattativa_id,a.trattativa)].filter(Boolean).join(" &nbsp;·&nbsp; ")}</div></div>
      <button class="ok" title="Segna come fatta" onclick="fattaDaPlancia(${a.id})">✓ Fatta</button></div>`;
  const gruppi = [["ambra","Scadute",d.agenda.filter(a=>a.scaduta)],["blu","Oggi",d.agenda.filter(a=>!a.scaduta&&a.oggi)],
                  ["","Prossimi 7 giorni",d.agenda.filter(a=>!a.scaduta&&!a.oggi&&a.scadenza)],["","Senza data",d.agenda.filter(a=>!a.scadenza)]].filter(g=>g[2].length);

function apriEsito2(id, k){
  ["fatta","nores","rim","ann"].forEach(x=>{ const p = $(`#esp-${x}${id}`); if(p) p.classList.toggle("on", x===k); });
  document.querySelectorAll(`#esb${id} .esb-b`).forEach(b=>b.classList.toggle("sel", k && b.classList.contains(k)));
  const f = k && $(`#esp-${k}${id} textarea, #esp-${k}${id} input`); if(f) f.focus();
}
async function resoconto(id, come){
  const v = sel => ($(sel)||{}).value || null;
  const body = {come};
  if(come==="fatta"){ body.resoconto = v("#rs"+id); body.processo = v("#pr"+id);
    if($("#nx"+id) && $("#nx"+id).checked){ body.prossimo_codice = v("#ns"+id); body.prossima_data = v("#nd"+id); } }
  if(come==="non risponde"){ body.resoconto = v("#rsn"+id); body.data = (v("#ndn"+id)||giornoTra(2)) + " " + (v("#ndno"+id)||"09:00"); }
  if(come==="rimanda"){ body.resoconto = v("#rsr"+id); body.data = (v("#ndr"+id)||giornoTra(1)) + " " + (v("#ndro"+id)||"09:00"); }
  if(come==="annullata"){ body.resoconto = v("#rsa"+id); if(!body.resoconto) { $("#rsa"+id).focus(); return toast("Scrivi perché la annulli"); } }
  try{ const r = await post(`/api/piano/${id}/resoconto`, body); META = await api("/api/meta");
    toast(come==="fatta" ? ("Operazione eseguita · scritta nel diario" + (r.prossima?" · creato il passo successivo":""))

    render(); }catch(e){ toast(e.message); } }

function attivaPieghe(){
  const pag = (parseHash().parts[0]||"comando") + (parseHash().parts[1]==="obiettivo"||parseHash().parts[1]==="azienda"||parseHash().parts[1]==="contatto"||parseHash().parts[1]==="trattativa"?"/"+parseHash().parts[1]:"");

    const k = "p:"+pag+":"+tit; p.dataset.pieg = k;

/* ---------- OFFERTE ECONOMICHE ---------- */
const STATI_OFF = {bozza:["Bozza","gri"], inviata:["Inviata","blu"], accettata:["Accettata","ok"], rifiutata:["Rifiutata","ross"], annullata:["Annullata","gri"], superata:["Superata","gri"]};
const statoOff = o => o.scaduta ? `<span class="sto amb">Scaduta</span>` : `<span class="sto ${STATI_OFF[o.stato][1]}">${STATI_OFF[o.stato][0]}</span>`;
const eur2 = v => (Number(v)||0).toLocaleString("it-IT",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
function calcolaOfferta(righe, sg){   // stesse regole di crm/offerte.py
  let imp=0, iva=0, costo=0; const out = righe.map(r=>{ const riga = Math.round(nn(r.quantita,1)*nn(r.prezzo)*(1-nn(r.sconto)/100)*100)/100;
    imp += riga; iva += riga*(1-nn(sg)/100)*nn(r.aliquota_iva,22)/100; costo += nn(r.quantita,1)*nn(r.costo); return {...r, importo:riga}; });
  const netto = Math.round(imp*(1-nn(sg)/100)*100)/100;
  return {righe:out, lordo:Math.round(imp*100)/100, imponibile:netto, iva:Math.round(iva*100)/100, totale:Math.round((netto+iva)*100)/100,
    costo_totale:Math.round(costo*100)/100, margine:costo?Math.round((netto-costo)*100)/100:null, margine_pct:costo&&netto?Math.round((netto-costo)/netto*1000)/10:null};
}

async function render(){
  const {parts,q} = parseHash();
  try{
    if(!META){ try{ META = await api("/api/meta"); }catch(e){ if(parts[0]!=="dati"){ location.hash = "/dati"; return; } } }
    if(!META && parts[0]==="dati"){ return await vistaDati(); }
    const nb = META.conteggi.allerte_dovute||0; $("#bellN").textContent = nb; $("#bell").classList.toggle("on", nb>0);
    if(parts[0]==="comando" || !parts.length) await vistaComando();
    else if(parts[0]==="oggi") await vistaPiano(q);
    else if(parts[0]==="calendario") await vistaCalendario(q);
    else if(parts[0]==="o"){ await vistaOggetto(parts[1], Number(parts[2])); if(parts[1]==="obiettivo" && q.assistente) await apriAssistente(Number(parts[2])); }
    else if(parts[0]==="cerca") await vistaCerca(q.q||"");
    else if(parts[0]==="centri") await vistaCentri(q);
    else if(parts[0]==="grafo") await vistaGrafo(q);
    else if(parts[0]==="iniziative") await vistaIniziative(q);
    else if(parts[0]==="dacontattare") await vistaDaContattare(q);
    else if(parts[0]==="allerte") await vistaAllerte(q);
    else if(parts[0]==="mappa") await vistaMappa(q);
    else if(parts[0]==="obiettivi") await vistaObiettivi(q);
    else if(parts[0]==="nuova") await vistaNuova(q);
    else if(parts[0]==="prodotti") await vistaProdotti(q);
    else if(parts[0]==="contatti") await vistaContatti(q);
    else if(parts[0]==="diario") await vistaDiario(q);
    else if(parts[0]==="note") await vistaNote(q);
    else if(parts[0]==="importa") await vistaImporta();
    else if(parts[0]==="budget") { if(parts[1]) await vistaBudget(Number(parts[1])); else await vistaBudgetElenco(); }
    else if(parts[0]==="offerte") await vistaOfferte(q);
    else if(parts[0]==="offerta") await vistaOfferta(Number(parts[1]), q);
    else if(parts[0]==="utenti") await vistaUtenti();
    else if(parts[0]==="dati") await vistaDati();
    else await vistaEsplora(q);
    attivaPieghe();
    $("#main").scrollTop = 0;
  }catch(e){ $("#main").innerHTML = `<div class="panel"><div class="empty">Errore: ${esc(e.message)}</div></div>`; }
}
window.addEventListener("hashchange", render);
$("#q").addEventListener("keydown", e => { if(e.key==="Enter" && e.target.value.trim()) vai(["cerca"],{q:e.target.value.trim()}); });
document.addEventListener("keydown", e => { if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape") chiudiNuova();
  const inCampo = ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName) || $("#modal").classList.contains("on");
  if(!inCampo && !e.metaKey && !e.ctrlKey && !e.altKey){
    const k = e.key.toLowerCase();
    if(k==="n"){ e.preventDefault(); apriNuova(); }
    else if(k==="d"){ e.preventDefault(); location.hash="/diario"; }
    else if(k==="i"){ e.preventDefault(); location.hash="/nuova"; }
    else if(k==="h"){ e.preventDefault(); location.hash="/comando"; }
    else if(k==="o"){ e.preventDefault(); location.hash="/oggi"; }
  } });
function orologio(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); const off=-d.getTimezoneOffset()/60;
  const zona = off===0?"Z":(off>0&&off<=9?"ABCDEFGHI"[off-1]:(off>=10&&off<=12?"KLM"[off-10]:"J"));
  const mesi=["GEN","FEB","MAR","APR","MAG","GIU","LUG","AGO","SET","OTT","NOV","DIC"];
  $("#clock").innerHTML = `<b>${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}</b><span>${d.toLocaleDateString("it-IT",{weekday:"short"}).toUpperCase()} ${p(d.getDate())} ${mesi[d.getMonth()]} ${d.getFullYear()} · DTG ${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${zona}</span>`; }
orologio(); setInterval(orologio, 1000);
render();
</script>
