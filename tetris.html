<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  :root {
    --bg: #0f0f1a;
    --panel: #1b1b2e;
    --grid: #2a2a40;
    --text: #e8e8f0;
    --accent: #5eead4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .game {
    display: flex;
    gap: 24px;
    padding: 24px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  canvas {
    background: #0a0a14;
    border-radius: 8px;
    display: block;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 160px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
  }
  .box {
    background: #14141f;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .box .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 4px;
  }
  .box .value {
    font-size: 24px;
    font-weight: 700;
  }
  .controls {
    font-size: 12px;
    line-height: 1.8;
    color: #aaa;
  }
  .controls b { color: var(--text); }
  #next {
    background: #0a0a14;
    border-radius: 8px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10,10,20,.85);
    border-radius: 16px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 32px; color: var(--accent); }
  .overlay p { margin: 0; color: #ccc; }
  .game { position: relative; }
  button {
    margin-top: 8px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0a0a14;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<div class="game">
  <canvas id="board" width="300" height="600"></canvas>
  <div class="sidebar">
    <h1>TETRIS</h1>
    <div class="box">
      <div class="label">Punteggio</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="box">
      <div class="label">Linee</div>
      <div class="value" id="lines">0</div>
    </div>
    <div class="box">
      <div class="label">Livello</div>
      <div class="value" id="level">1</div>
    </div>
    <div class="box">
      <div class="label">Prossimo</div>
      <canvas id="next" width="132" height="132"></canvas>
    </div>
    <div class="controls">
      <b>←/→</b> muovi<br>
      <b>↓</b> scendi veloce<br>
      <b>↑ / X</b> ruota<br>
      <b>Spazio</b> caduta rapida<br>
      <b>P</b> pausa
    </div>
  </div>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-text">Premi Invio per ricominciare</p>
    <button id="restart">Nuova partita</button>
  </div>
</div>

<script>
const COLS = 10, ROWS = 20, CELL = 30;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');

const scoreEl = document.getElementById('score');
const linesEl = document.getElementById('lines');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');

// Definizione dei 7 tetramini con il loro colore
const SHAPES = {
  I: { color: '#5eead4', cells: [[0,1],[1,1],[2,1],[3,1]] },
  O: { color: '#facc15', cells: [[1,0],[2,0],[1,1],[2,1]] },
  T: { color: '#c084fc', cells: [[1,0],[0,1],[1,1],[2,1]] },
  S: { color: '#4ade80', cells: [[1,0],[2,0],[0,1],[1,1]] },
  Z: { color: '#f87171', cells: [[0,0],[1,0],[1,1],[2,1]] },
  J: { color: '#60a5fa', cells: [[0,0],[0,1],[1,1],[2,1]] },
  L: { color: '#fb923c', cells: [[2,0],[0,1],[1,1],[2,1]] },
};
const TYPES = Object.keys(SHAPES);

let grid, current, nextPiece, score, lines, level, dropCounter, dropInterval, lastTime, running, paused, gameOver;

function emptyGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

// Crea una matrice 4x4 (o NxN) a partire dalla lista di celle
function makeMatrix(type) {
  const cells = SHAPES[type].cells;
  const size = type === 'I' ? 4 : 3;
  const m = Array.from({ length: size }, () => Array(size).fill(null));
  for (const [x, y] of cells) m[y][x] = type;
  return m;
}

function spawnPiece() {
  const type = nextPiece || randomType();
  nextPiece = randomType();
  const matrix = makeMatrix(type);
  current = {
    type,
    matrix,
    x: Math.floor((COLS - matrix[0].length) / 2),
    y: 0,
  };
  if (collides(current)) {
    endGame();
  }
  drawNext();
}

function randomType() {
  return TYPES[Math.floor(Math.random() * TYPES.length)];
}

function collides(piece) {
  const { matrix, x, y } = piece;
  for (let r = 0; r < matrix.length; r++) {
    for (let c = 0; c < matrix[r].length; c++) {
      if (!matrix[r][c]) continue;
      const nx = x + c, ny = y + r;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && grid[ny][nx]) return true;
    }
  }
  return false;
}

function merge(piece) {
  const { matrix, x, y } = piece;
  for (let r = 0; r < matrix.length; r++) {
    for (let c = 0; c < matrix[r].length; c++) {
      if (matrix[r][c] && y + r >= 0) {
        grid[y + r][x + c] = matrix[r][c];
      }
    }
  }
}

// Rotazione oraria della matrice
function rotate(matrix) {
  const N = matrix.length;
  const res = Array.from({ length: N }, () => Array(N).fill(null));
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      res[c][N - 1 - r] = matrix[r][c];
    }
  }
  return res;
}

function tryRotate() {
  const rotated = rotate(current.matrix);
  const test = { ...current, matrix: rotated };
  // wall kick: prova a spostare se la rotazione collide
  for (const offset of [0, -1, 1, -2, 2]) {
    test.x = current.x + offset;
    if (!collides(test)) {
      current.matrix = rotated;
      current.x = test.x;
      return;
    }
  }
}

function move(dir) {
  current.x += dir;
  if (collides(current)) current.x -= dir;
}

function softDrop() {
  current.y++;
  if (collides(current)) {
    current.y--;
    lockPiece();
  } else {
    score += 1;
    updateStats();
  }
  dropCounter = 0;
}

function hardDrop() {
  let dist = 0;
  while (!collides(current)) {
    current.y++;
    dist++;
  }
  current.y--;
  score += (dist - 1) * 2;
  updateStats();
  lockPiece();
  dropCounter = 0;
}

function lockPiece() {
  merge(current);
  clearLines();
  spawnPiece();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(cell => cell)) {
      grid.splice(r, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      r++; // ricontrolla la stessa riga
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(80, 1000 - (level - 1) * 90);
    updateStats();
  }
}

function updateStats() {
  scoreEl.textContent = score;
  linesEl.textContent = lines;
  levelEl.textContent = level;
}

function drawCell(context, x, y, color, size = CELL) {
  context.fillStyle = color;
  context.fillRect(x * size, y * size, size, size);
  context.fillStyle = 'rgba(255,255,255,.15)';
  context.fillRect(x * size, y * size, size, size / 5);
  context.strokeStyle = 'rgba(0,0,0,.35)';
  context.lineWidth = 2;
  context.strokeRect(x * size, y * size, size, size);
}

function draw() {
  // sfondo + griglia
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, board.width, board.height);
  ctx.strokeStyle = '#16162400';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeStyle = '#161624';
      ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
    }
  }

  // blocchi fissati
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c]) drawCell(ctx, c, r, SHAPES[grid[r][c]].color);
    }
  }

  if (current) {
    // ghost piece (anteprima di caduta)
    const ghost = { ...current, y: current.y };
    while (!collides({ ...ghost, y: ghost.y + 1 })) ghost.y++;
    ctx.globalAlpha = 0.25;
    forEachCell(current.matrix, (c, r) => {
      drawCell(ctx, ghost.x + c, ghost.y + r, SHAPES[current.type].color);
    });
    ctx.globalAlpha = 1;

    // pezzo corrente
    forEachCell(current.matrix, (c, r) => {
      if (current.y + r >= 0)
        drawCell(ctx, current.x + c, current.y + r, SHAPES[current.type].color);
    });
  }
}

function forEachCell(matrix, fn) {
  for (let r = 0; r < matrix.length; r++)
    for (let c = 0; c < matrix[r].length; c++)
      if (matrix[r][c]) fn(c, r);
}

function drawNext() {
  nctx.fillStyle = '#0a0a14';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  const matrix = makeMatrix(nextPiece);
  const size = 28;
  const offsetX = (nextCanvas.width / size - matrix[0].length) / 2;
  const offsetY = (nextCanvas.height / size - matrix.length) / 2;
  forEachCell(matrix, (c, r) => {
    drawCell(nctx, offsetX + c, offsetY + r, SHAPES[nextPiece].color, size);
  });
}

function update(time = 0) {
  if (!running) return;
  const delta = time - lastTime;
  lastTime = time;
  if (!paused && !gameOver) {
    dropCounter += delta;
    if (dropCounter > dropInterval) {
      current.y++;
      if (collides(current)) {
        current.y--;
        lockPiece();
      }
      dropCounter = 0;
    }
    draw();
  }
  requestAnimationFrame(update);
}

function endGame() {
  gameOver = true;
  overlayTitle.textContent = 'Game Over';
  overlayText.textContent = 'Premi Invio per ricominciare';
  overlay.classList.add('show');
}

function init() {
  grid = emptyGrid();
  score = 0; lines = 0; level = 1;
  dropCounter = 0; dropInterval = 1000; lastTime = 0;
  paused = false; gameOver = false; running = true;
  nextPiece = randomType();
  overlay.classList.remove('show');
  updateStats();
  spawnPiece();
  requestAnimationFrame(update);
}

document.addEventListener('keydown', (e) => {
  if (gameOver) {
    if (e.key === 'Enter') init();
    return;
  }
  switch (e.key) {
    case 'ArrowLeft':  move(-1); break;
    case 'ArrowRight': move(1); break;
    case 'ArrowDown':  softDrop(); break;
    case 'ArrowUp':
    case 'x':
    case 'X':          tryRotate(); break;
    case ' ':          e.preventDefault(); hardDrop(); break;
    case 'p':
    case 'P':
      paused = !paused;
      overlayTitle.textContent = 'Pausa';
      overlayText.textContent = 'Premi P per continuare';
      overlay.classList.toggle('show', paused);
      break;
  }
  if (!paused) draw();
});

document.getElementById('restart').addEventListener('click', init);

init();
</script>
</body>
</html>
